[project]
name = "planetary-council"
version = "0.1.0"
description = "Planetary Council / BaseX — lightweight human-agent interface"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
