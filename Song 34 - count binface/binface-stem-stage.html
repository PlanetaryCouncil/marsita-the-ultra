<!doctype html>
<html lang="en">
<head>

  <title>Vote for the Bin — Stem Stage</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #08050a; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #08050a; }
    main { max-width: 1320px; margin: auto; }

    .sub { color: #b8a8b8; margin: 6px 0 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }

    button { background: #f000ab; color: #fff; border: 1px solid #ff77d4; border-radius: 7px; padding: 9px 13px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary { background: #1d1220; border-color: #6a4168; }
    input[type="file"] { max-width: 370px; color: #d8cbd8; }
    input[type="range"] { min-width: 220px; accent-color: #f000ab; }
    #stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; isolation: isolate; background: radial-gradient(circle at 50% 0%, #1b1235, #06070d 56%, #020205); }
    #stage::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.42)); z-index: 1; pointer-events: none; }
    #visuals { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
    #caption { position: absolute; z-index: 4; left: 8%; right: 8%; top: 12%; text-align: center; font-size: clamp(28px, 6vw, 82px); font-weight: 900; letter-spacing: .05em; color: #fff; text-shadow: 0 3px 0 #120415, 0 0 18px #ff00bd; min-height: 1.2em; }
    #track-list { position: absolute; z-index: 4; left: 18px; bottom: 15px; display: grid; gap: 5px; max-width: 42%; }
    .track { display: flex; align-items: center; gap: 7px; color: #fff; font-size: clamp(11px, 1.4vw, 17px); text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--colour); box-shadow: 0 0 10px var(--colour); }
    #time { color: #78ff89; font-variant-numeric: tabular-nums; font-weight: 700; }
    #load-state { color: #b8a8b8; font-weight: 700; }
    details { margin: 0 0 14px; color: #b8a8b8; }
    details summary { cursor: pointer; }
    .manual-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 10px; }
    .hint { margin: 10px 0 0; color: #b8a8b8; }
    @media (max-width: 620px) { body { padding: 10px; } .controls { gap: 7px; } button { padding: 8px 10px; } input[type="range"] { min-width: 150px; } #caption { top: 10%; } }
  </style>
</head>
<body>
  <main>
    <h1>VOTE FOR THE BIN — LIVE STEM STAGE</h1>
    <p class="sub">The project loads itself. Press Play.</p>
    <div class="controls">
      <button id="play" type="button" disabled>Loading defaults…</button>
      <button id="mute" class="secondary" type="button">Mute</button>
      <span id="load-state">Loading project…</span>
      <span id="time">00:00.000 / 00:00.000</span>
      <input id="seek" type="range" min="0" max="1" value="0" step="0.001" aria-label="Seek through track">
    </div>
    <details>
      <summary>Manual files</summary>
      <div class="manual-controls">
        <label>Full audio <input id="full-audio" type="file" accept="audio/*"></label>
        <label>Add stems <input id="stems" type="file" accept="audio/*" multiple></label>
        <button id="defaults" class="secondary" type="button">Reload defaults</button>
      </div>
    </details>
    <section id="stage" aria-label="Real-time music visualizer">
      <canvas id="visuals"></canvas>
      <div id="track-list" aria-live="polite"></div>
      <div id="caption" aria-live="polite"></div>
    </section>
    <p class="hint">Each loaded file gets its own live waveform lane. Lyrics advance one word at a time from the vocal timing anchors.</p>
  </main>

    const wordCues = wordTiming.map((cue, index) => [cue.t, Math.min(wordTiming[index + 1]?.t ?? cue.t + 1.35, cue.t + 1.35), cue.w]);
    const palette = ['#57d9ff','#78ff89','#ff00bd','#ffc857','#b38cff','#ff6f61','#f5f5f5'];
    const fullAudio = document.getElementById('full-audio'); const stems = document.getElementById('stems'); const defaults = document.getElementById('defaults'); const play = document.getElementById('play'); const mute = document.getElementById('mute');
    const seek = document.getElementById('seek'); const time = document.getElementById('time'); const caption = document.getElementById('caption'); const loadState = document.getElementById('load-state');
    const trackList = document.getElementById('track-list'); const canvas = document.getElementById('visuals'); const stage = document.getElementById('stage'); const ctx = canvas.getContext('2d');

    const projectRoot = '.';
    const projectDefaults = {
      master: { name: 'Marsita the Ultra — Vote for the Bin (Count Binface vs Farage).mp3', url: `${projectRoot}/FINAL%20AUDIO/Marsita%20the%20Ultra%20%E2%80%94%20Vote%20for%20the%20Bin%20(Count%20Binface%20vs%20Farage).mp3` },
      stems: [
        { name: '1 Woodwinds.mp3', url: `${projectRoot}/STEMS/1%20Woodwinds.mp3` },
        { name: '3 FX.mp3', url: `${projectRoot}/STEMS/3%20FX.mp3` },
        { name: '4 Synth.mp3', url: `${projectRoot}/STEMS/4%20Synth.mp3` },
        { name: '6 Percussion.mp3', url: `${projectRoot}/STEMS/6%20Percussion.mp3` },
        { name: '8 Guitar.mp3', url: `${projectRoot}/STEMS/8%20Guitar.mp3` },
        { name: '9 Bass.mp3', url: `${projectRoot}/STEMS/9%20Bass.mp3` },
        { name: '10 Drums.mp3', url: `${projectRoot}/STEMS/10%20Drums.mp3` },
        { name: '11 Backing_Vocals.mp3', url: `${projectRoot}/STEMS/11%20Backing_Vocals.mp3` },
        { name: '12 Vocals.mp3', url: `${projectRoot}/STEMS/12%20Vocals.mp3` },
        { name: '13 my own background vocal.mp3', url: `${projectRoot}/STEMS/13%20my%20own%20background%20vocal.mp3` }
      ]
    };
    function format(seconds) { const total = Math.round((seconds || 0) * 1000); return `${String(Math.floor(total / 60000)).padStart(2,'0')}:${String(Math.floor(total / 1000) % 60).padStart(2,'0')}.${String(total % 1000).padStart(3,'0')}`; }
    function roleFor(name) { const value = name.toLowerCase(); if (value.includes('vocal') && value.includes('back')) return 'backing'; if (value.includes('vocal')) return 'lead'; if (value.includes('drum') || value.includes('perc')) return 'drums'; if (value.includes('bass')) return 'bass'; if (value.includes('master') || value.includes('final') || value.includes('mix') || value.includes('vote for the bin')) return 'master'; return 'other'; }
    function resize() { const ratio = window.devicePixelRatio || 1; const rect = stage.getBoundingClientRect(); canvas.width = rect.width * ratio; canvas.height = rect.height * ratio; canvas.style.width = `${rect.width}px`; canvas.style.height = `${rect.height}px`; ctx.setTransform(ratio,0,0,ratio,0,0); }
    function renderTracks() { trackList.innerHTML = tracks.map(track => `<div class="track"><span class="dot" style="--colour:${track.colour}"></span>${track === master ? 'FULL AUDIO — ' : ''}${track.file.name}</div>`).join(''); }
    function connectSource(file, index, url) {
      const audio = new Audio(url || URL.createObjectURL(file)); audio.preload = 'auto';
      const source = audioContext.createMediaElementSource(audio); const analyser = audioContext.createAnalyser(); const silentGain = audioContext.createGain(); analyser.fftSize = 512; silentGain.gain.value = 0; source.connect(analyser); analyser.connect(silentGain);
      const role = roleFor(file.name); const track = { file, audio, analyser, silentGain, bins: new Uint8Array(analyser.frequencyBinCount), waveform: new Uint8Array(analyser.fftSize), role, colour: palette[index % palette.length] };
      return new Promise(resolve => { audio.addEventListener('loadedmetadata', () => resolve(track), { once: true }); audio.load(); });
    }
    function connectTrack(file, index) { return connectSource(file, index); }
    function connectDefault(file, index) { return connectSource(file, index, file.url); }
    function connectToOutput(track) { (track === master ? track.analyser : track.silentGain).connect(audioContext.destination); }
    function attachMasterEvents() {
      master.audio.addEventListener('timeupdate', updateTime); master.audio.addEventListener('ended', () => { play.textContent = 'Play'; });
    }
    async function loadFullAudio(file) {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (master) { master.audio.pause(); URL.revokeObjectURL(master.audio.src); tracks = tracks.filter(track => track !== master); }
      master = await connectTrack(file, 0); master.role = 'master'; tracks.unshift(master); connectToOutput(master); attachMasterEvents();
      renderTracks(); updateTime();
    }
    async function addStems(selectedFiles) {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const additions = await Promise.all([...selectedFiles].map((file, index) => connectTrack(file, tracks.length + index)));
      additions.forEach(track => { if (track.role === 'master') track.role = 'other'; tracks.push(track); connectToOutput(track); });
      renderTracks();
    }
    async function loadProjectDefaults() {
      tracks.forEach(track => track.audio.pause()); tracks = []; master = null;
      await loadFullDefault(projectDefaults.master);
      const additions = await Promise.all(projectDefaults.stems.map((file, index) => connectDefault(file, tracks.length + index)));
      additions.forEach(track => { tracks.push(track); connectToOutput(track); });
      renderTracks();
    }
    async function prepareDefaults() {
      play.disabled = true; play.textContent = 'Loading defaults…'; loadState.textContent = 'Loading project…';
      try { await loadProjectDefaults(); play.disabled = false; play.textContent = 'Play'; loadState.textContent = 'Ready'; }
      catch (error) { console.error(error); play.disabled = true; play.textContent = 'Load failed'; loadState.textContent = 'Open Manual files to retry'; }
    }
    async function loadFullDefault(file) {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (master) { master.audio.pause(); URL.revokeObjectURL(master.audio.src); tracks = tracks.filter(track => track !== master); }
      master = await connectDefault(file, 0); master.role = 'master'; tracks.unshift(master); connectToOutput(master); attachMasterEvents(); renderTracks(); updateTime();
    }
    function updateTime() { if (!master) return; const current = master.audio.currentTime || 0; const duration = master.audio.duration || 0; seek.max = duration || 1; seek.value = current; time.textContent = `${format(current)} / ${format(duration)}`; const cue = wordCues.find(([start,end]) => current >= start && current <= end); caption.textContent = cue ? cue[2] : ''; }
    async function togglePlay() {
      if (!master) return; await audioContext.resume();
      if (master.audio.paused) { const at = master.audio.currentTime; tracks.forEach(track => { track.audio.currentTime = at; track.audio.play(); }); play.textContent = 'Pause'; } else { tracks.forEach(track => track.audio.pause()); play.textContent = 'Play'; }
    }
    function average(track, from, to) { let sum = 0; const end = Math.min(track.bins.length, to); for (let i = from; i < end; i++) sum += track.bins[i]; return sum / Math.max(1, end - from) / 255; }

      const top = height * .60, available = height * .31, laneHeight = available / Math.max(total, 1), center = top + laneHeight * (index + .5);
      track.analyser.getByteTimeDomainData(track.waveform); track.analyser.getByteFrequencyData(track.bins); const energy = average(track, 0, 28);
      ctx.strokeStyle = track.colour; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0,center); ctx.lineTo(width,center); ctx.stroke();
      ctx.globalAlpha = .55 + energy * .45; ctx.lineWidth = 1.4 + energy * 3.5; ctx.beginPath();
      track.waveform.forEach((sample, point) => { const x = point / (track.waveform.length - 1) * width; const y = center + ((sample - 128) / 128) * laneHeight * .38; point ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    function drawSpace(width, height, seconds) {
      const horizon = height * .48, vanishingX = width * .5;
      const masterEnergy = master ? average(master, 0, 28) : .1;
      ctx.globalAlpha = .42; ctx.strokeStyle = '#ff00bd'; ctx.lineWidth = 1;
      for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(vanishingX, horizon); ctx.lineTo(vanishingX + i * width * .12, height); ctx.stroke(); }
      for (let i = 0; i < 18; i++) { const depth = ((i / 18 + seconds * .065) % 1); const y = horizon + Math.pow(depth, 2.2) * (height - horizon); ctx.globalAlpha = .08 + depth * .42; ctx.strokeStyle = i % 2 ? '#7c63ff' : '#ff00bd'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); }
      for (let i = 0; i < 34; i++) { const depth = ((i * .117 + seconds * (.04 + (i % 5) * .006)) % 1); const x = width * ((Math.sin(i * 93.17) + 1) / 2); const y = horizon + ((Math.cos(i * 41.9) + 1) / 2) * height * .43; const scale = 2 + depth * depth * 24 * (1 + masterEnergy); ctx.globalAlpha = .13 + depth * .65; ctx.fillStyle = i % 3 === 0 ? '#57d9ff' : i % 3 === 1 ? '#78ff89' : '#ff00bd'; ctx.beginPath(); ctx.arc(x + Math.sin(seconds + i) * depth * 40, y, scale, 0, Math.PI * 2); ctx.fill(); }
      for (let i = 0; i < 3; i++) { const x = width * (.23 + i * .27), y = horizon - 35 + Math.sin(seconds * .6 + i) * 24, size = 26 + i * 12 + masterEnergy * 45, angle = seconds * (.45 + i * .08); ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.strokeStyle = i === 1 ? '#57d9ff' : '#ff00bd'; ctx.globalAlpha = .5; ctx.lineWidth = 2; ctx.strokeRect(-size,-size,size*2,size*2); ctx.rotate(Math.PI / 4); ctx.strokeRect(-size*.7,-size*.7,size*1.4,size*1.4); ctx.restore(); }

    }

      const rect = stage.getBoundingClientRect(); const width = rect.width, height = rect.height; ctx.clearRect(0,0,width,height); drawSpace(width, height, master?.audio.currentTime || 0);

    }
    fullAudio.addEventListener('change', async event => { if (event.target.files[0]) { play.disabled = true; await loadFullAudio(event.target.files[0]); play.disabled = false; play.textContent = 'Play'; loadState.textContent = 'Manual audio ready'; } });
    stems.addEventListener('change', event => { if (event.target.files.length) { addStems(event.target.files); event.target.value = ''; } });
    defaults.addEventListener('click', prepareDefaults);
    play.addEventListener('click', togglePlay);
    mute.addEventListener('click', () => { muted = !muted; if (master) master.audio.muted = muted; mute.textContent = muted ? 'Unmute' : 'Mute'; });
    seek.addEventListener('input', () => { if (!master) return; const at = Number(seek.value); tracks.forEach(track => { track.audio.currentTime = at; }); updateTime(); });
    window.addEventListener('resize', resize); resize(); draw(); prepareDefaults();
