  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

xOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  :root{ --pink:#ff5d8f; --ink:#241f22; --paper:#f3e9df; }\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; height:100%; }\n  body{ font-family:'Space Grotesk', system-ui, sans-serif; color:var(--ink); background:var(--paper); }\n  three-d-stage:not(:defined){ visibility:hidden; }\n  #app{ display:flex; flex-direction:column; height:100vh; }\n  #menu{\n    flex:0 0 auto; display:flex; align-items:center; gap:16px;\n    padding:11px 18px; flex-wrap:wrap;\n    border-bottom:1px solid rgba(36,31,34,.08);\n    background:rgba(255,255,255,.72); backdrop-filter:blur(12px);\n    -webkit-backdrop-filter:blur(12px); position:relative; z-index:5;\n  }\n  .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:.01em; white-space:nowrap; }\n  .brand .dot{ width:15px; height:15px; border-radius:50%; background:var(--pink); box-shadow:0 0 0 3px rgba(255,93,143,.22); }\n  .brand small{ font-weight:500; opacity:.45; font-size:11px; margin-left:1px; letter-spacing:.02em; }\n  .group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }\n  .plabel{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; opacity:.5; margin-right:3px; }\n  .chip{ appearance:none; border:1px solid rgba(36,31,34,.14); background:#fff; color:var(--ink);\n    font-family:inherit; font-size:13px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; transition:.15s ease; }\n  .chip:hover{ border-color:var(--pink); color:var(--pink); }\n  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }\n  .chip.active:hover{ color:#fff; }\n  .sw{ width:27px; height:27px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(36,31,34,.2); cursor:pointer; padding:0; transition:.15s ease; }\n  .sw:hover{ transform:scale(1.08); }\n  .sw.active{ box-shadow:0 0 0 2px var(--ink); }\n  .toggle{ appearance:none; border:1px solid rgba(36,31,34,.14); background:#fff; color:var(--ink);\n    font-family:inherit; font-size:12px; font-weight:600; padding:8px 12px; border-radius:999px; cursor:pointer; transition:.15s ease; display:flex; align-items:center; gap:7px; }\n  .toggle .led{ width:9px; height:9px; border-radius:50%; background:var(--pink); box-shadow:0 0 0 3px rgba(255,93,143,.25); transition:.15s; }\n  .toggle.off .led{ background:#bbb; box-shadow:0 0 0 3px rgba(0,0,0,.06); }\n  .spacer{ flex:1 1 auto; }\n  #camBar{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:6;\n    display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;\n    background:rgba(255,255,255,.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);\n    border:1px solid rgba(36,31,34,.08); box-shadow:0 4px 18px rgba(0,0,0,.12); }\n  #camBar .chip{ padding:7px 12px; font-size:12.5px; }\n  #camShow{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:6; display:none; }\n  three-d-stage{ flex:1 1 auto; min-height:0; height:auto; }\n  @media(max-width:820px){ .brand small{ display:none; } .plabel{ display:none; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"app\">\n  <header id=\"menu\">\n    <div class=\"brand\"><span class=\"dot\"><\u002Fspan>Flamingo Band<small>v14<\u002Fsmall><\u002Fdiv>\n    <div class=\"sep\"><\u002Fdiv>\n    <div class=\"group\" id=\"models\"><\u002Fdiv>\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"toggle\" id=\"danceToggle\"><span class=\"led\"><\u002Fspan>Dancing<\u002Fbutton>\n    <button class=\"toggle\" id=\"polyToggle\"><span class=\"led\"><\u002Fspan>Low-poly<\u002Fbutton>\n    <button class=\"toggle\" id=\"rerollBtn\"><span class=\"led\"><\u002Fspan>Randomize<\u002Fbutton>\n    <span class=\"plabel\">Venue<\u002Fspan>\n    <div class=\"group\" id=\"venueBar\">\n      <button class=\"chip\" data-v=\"forest\">Forest<\u002Fbutton>\n      <button class=\"chip\" data-v=\"indoor\">Warehouse<\u002Fbutton>\n      <button class=\"chip\" data-v=\"playa\">Burning Man<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"group\" id=\"palettes\"><span class=\"plabel\">Palette<\u002Fspan><\u002Fdiv>\n  <\u002Fheader>\n  <three-d-stage name=\"flamingo-band\" background=\"#f3e9df\" style=\"flex:1 1 auto; min-height:0; height:auto;\"><\u002Fthree-d-stage>\n  <div id=\"camBar\">\n    <span class=\"plabel\">Camera<\u002Fspan>\n    <button class=\"chip\" data-c=\"0\">Orbit<\u002Fbutton>\n    <button class=\"chip\" data-c=\"1\">1<\u002Fbutton>\n    <button class=\"chip\" data-c=\"2\">2<\u002Fbutton>\n    <button class=\"chip\" data-c=\"3\">3<\u002Fbutton>\n    <button class=\"chip\" data-c=\"4\">4<\u002Fbutton>\n    <button class=\"chip\" data-c=\"r\">Random<\u002Fbutton>\n    <button class=\"chip\" data-c=\"g\">2×2<\u002Fbutton>\n    <button class=\"chip\" data-c=\"h\">Hide<\u002Fbutton>\n    <span class=\"plabel\">Audio<\u002Fspan>\n    <button class=\"chip\" id=\"stemsBtn\">Stems…<\u002Fbutton>\n    <button class=\"chip\" id=\"playBtn\" style=\"display:none\">Pause<\u002Fbutton>\n    <button class=\"chip\" id=\"videosBtn\">Videos…<\u002Fbutton>\n    <input type=\"file\" id=\"videosInput\" accept=\"video/*\" multiple=\"\" style=\"display:none\">\n    <button class=\"chip\" id=\"aboutBtn\">About<\u002Fbutton>\n    <input type=\"file\" id=\"stemsInput\" accept=\"audio/*\" multiple=\"\" style=\"display:none\">\n  <\u002Fdiv>\n  <button class=\"chip\" id=\"camShow\">Cams<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"aboutOverlay\" style=\"display:none; position:fixed; inset:0; z-index:20; background:rgba(10,9,16,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); overflow:auto;\">\n  <div style=\"max-width:720px; margin:6vh auto; background:#17141f; color:#eae7f2; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:28px 30px; font-size:14px; line-height:1.55;\">\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <span style=\"width:14px;height:14px;border-radius:50%;background:#ff5d8f;box-shadow:0 0 0 3px rgba(255,93,143,.25);\"><\u002Fspan>\n      <h2 style=\"margin:0; font-size:20px;\">Flamingo Band — About<\u002Fh2>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button class=\"chip\" id=\"aboutClose\">Close<\u002Fbutton>\n    <\u002Fdiv>\n    <p>A generative 3D rave scene built with three.js. A wall of sound — a rectangular grid of speaker cabinets and screens — hosts a band of articulated pink flamingos (3-DOF wrists, fingered hands, jointed legs, unique instruments, randomized beaks and sunglasses) dancing on top. A giant white rabbit with a red resonating heart levitates behind. Venues: Forest rave, Warehouse, Burning Man playa (radio buttons). Everything rerolls with Randomize; the layout seed survives venue swaps.<\u002Fp>\n    <p><b>Screens:<\u002Fb> one 2×2 video block + extra video cells (load your own rave footage via <i>Videos…<\u002Fi>), spectrum analyser panels, on-screen lyrics, and glitchy cyber sponsor slots.<\u002Fp>\n    <p><b>Audio:<\u002Fb> load stems via <i>Stems…<\u002Fi> — each speaker column follows its own stem; dance amplitude, heart, crowd and visualisers react live.<\u002Fp>\n    <p><b>Cameras:<\u002Fb> bottom bar — orbit, 4 drone POVs, random auto-cut (3–5 s), 2×2 split screen, hide.<\u002Fp>\n    <h3 style=\"margin:18px 0 8px; font-size:15px;\">Context prompt for another AI<\u002Fh3>\n    <textarea id=\"aiPrompt\" readonly=\"\" style=\"width:100%; height:200px; background:#0d0b14; color:#b8b2d9; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:12px; font:12px/1.5 monospace; resize:vertical;\">You are continuing work on \"Flamingo Band\" — a single-file three.js HTML app (no build step) rendered in a &lt;three-d-stage&gt; web component (orbit controls, auto-framing, OBJ/GLB export). Key architecture:\n• Models are built procedurally from primitives via helpers: mesh/sphere/box/cyl/tubeBetween; SEG(n) reduces segments when LOWPOLY; materials from buildMaterials(palette).\n• Flamingos: buildFlamingo() returns a rig with userData.J joints {legs(hip/knee/ankle/foot), armR/armL(shoulder/elbow/hand+fingers+thumb), neck[3], head, pelvis, torso}; danceRig(J,t,opts) animates; makePlayer(M,kind) poses one with an instrument (sax/tamb/keys/drums/piano/solo) and returns {group,tick}.\n• buildFestival(M): seeded RNG (mulberry32(LAYOUT_SEED)) so venue swaps keep the layout. Rectangular wall grid: NCOL×4 cells (cellW 1.5, cellH 0.86), cell types 'spk'|'vid'(2×2)|'vid1'|'spec'|'lyr'|'spon'. Flamingos seated on wall top via Box3 (position.y = wallTop - bb.min.y).\n• Venues: VENUE global ('forest'|'indoor'|'playa') — forest grid field+trees, warehouse trusses+skylights, playa cracks+bikes+dust devils+art cars+far ridge.\n• Audio: Web Audio; loadStems(files) — per-stem analysers feed AUDIO.stems[i] {level,bass,high}; master analyser fills AUDIO.{level,bass,mid,high,wave,spec[24]}. Speaker cones push on bass; spectrum bars use AUDIO.spec.\n• Video: getVideoTexture(slot) — THREE.VideoTexture; slot 0 = 2×2 block; USER_VIDEOS from the Videos… file input (object URLs, round-robin).\n• Cameras: bottom camBar — CAMVIEW 0=orbit else drone POV; Random auto-cut timer 3-5s; GRID renders 4 viewports via setScissor; savedOrbit restores the user's view.\n• UI state in URL hash: m(model) p(palette) v(venue) lp(low-poly) dance.\nConventions: version each revision as a new file \"Flamingo Band vNN.html\"; keep everything in one file; inline styles; no frameworks; test by switching venues and loading stems.<\u002Ftextarea>\n    <div style=\"margin-top:10px; display:flex; gap:8px;\">\n      <button class=\"chip\" id=\"aiCopy\">Copy prompt<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script src=\"f3924ec0-25c2-4ca4-8338-1a6cd0d5a575\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\nconst hp=new URLSearchParams(location.hash.replace(/^#/,''));\nlet LOWPOLY = hp.get('lp')!=='0';\nlet CAMVIEW = 0; // 0=orbit, 1..3 = drone POV\nlet VIDEO_SCREEN=null; // {mesh,w,h} — festival screen surface for the embedded video\nlet VENUE = hp.get('v')||'forest'; // forest | indoor | playa\nlet LAYOUT_SEED = Math.floor(Math.random()*1e9); // layout persists across venue swaps\nfunction mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }\n/* ---- audio engine (stems) ---- */\nlet AC=null,master=null,analyser=null,freqData=null,timeData=null,audioSources=[],audioBuffers=[],audioPlaying=false;\nlet stemChains=[]; // per-stem {analyser,data}\nconst AUDIO={level:0,bass:0,mid:0,high:0,wave:null,stems:[]};\nasync function loadStems(files){\n  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();\n    master=AC.createGain(); analyser=AC.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.75;\n    master.connect(analyser); analyser.connect(AC.destination);\n    freqData=new Uint8Array(analyser.frequencyBinCount); timeData=new Uint8Array(analyser.fftSize); }\n  stopStems(); audioBuffers=[];\n  for(const f of files){ const ab=await f.arrayBuffer(); audioBuffers.push(await AC.decodeAudioData(ab)); }\n  stemChains=audioBuffers.map(()=>{ const a=AC.createAnalyser(); a.fftSize=512; a.smoothingTimeConstant=0.7;\n    a.connect(master); return {analyser:a,data:new Uint8Array(a.frequencyBinCount)}; });\n  AUDIO.stems=audioBuffers.map(()=>({level:0,bass:0,high:0}));\n  playStems();\n}\nfunction playStems(){ if(!audioBuffers.length) return; stopStems();\n  audioSources=audioBuffers.map((b,i)=>{ const s=AC.createBufferSource(); s.buffer=b; s.loop=true; s.connect(stemChains[i].analyser); return s; });\n  const t0a=AC.currentTime+0.05; audioSources.forEach(s=>s.start(t0a)); audioPlaying=true; AC.resume(); }\nfunction stopStems(){ audioSources.forEach(s=>{try{s.stop();}catch(e){}}); audioSources=[]; audioPlaying=false; }\nfunction updateAudio(){ if(!analyser||!audioPlaying){ AUDIO.level*=0.94; AUDIO.bass*=0.94; AUDIO.stems.forEach(st=>{st.level*=0.92;st.bass*=0.92;st.high*=0.92;}); return; }\n  analyser.getByteFrequencyData(freqData); analyser.getByteTimeDomainData(timeData);\n  const avg=(a,b)=>{ let s=0; for(let i=a;i<b;i++) s+=freqData[i]; return s/(b-a)/255; };\n  AUDIO.bass=avg(1,24); AUDIO.mid=avg(24,120); AUDIO.high=avg(120,400);\n  AUDIO.level=(AUDIO.bass*1.2+AUDIO.mid+AUDIO.high*0.8)/3; AUDIO.wave=timeData;\n  // 24-band spectrum for the visualiser\n  if(!AUDIO.spec) AUDIO.spec=new Float32Array(24);\n  for(let b=0;b<24;b++){ const a0=Math.floor(Math.pow(b/24,1.6)*380)+1, a1=Math.floor(Math.pow((b+1)/24,1.6)*380)+2;\n    let sm=0; for(let k=a0;k<a1;k++) sm+=freqData[k]; AUDIO.spec[b]=sm/(a1-a0)/255; }\n  stemChains.forEach((ch,i)=>{ ch.analyser.getByteFrequencyData(ch.data); const d=ch.data, N=d.length;\n    const sub=(a,b)=>{ let s=0; for(let k=a;k<b;k++) s+=d[k]; return s/(b-a)/255; };\n    const st=AUDIO.stems[i]; st.bass=sub(1,Math.floor(N*0.08)); st.high=sub(Math.floor(N*0.35),N-1);\n    st.level=(st.bass*1.3+sub(Math.floor(N*0.08),Math.floor(N*0.35))+st.high*0.7)/3; }); }\nconst SEG=n=>LOWPOLY?Math.max(5,Math.round(n*0.4)):n;\n\n/* ---------- palettes ---------- */\nconst PALETTES = {\n  cosmos: { label:'Cosmos', bg:'#0a0918',\n    body:'#ff4fa3', belly:'#ff9ecf', wing:'#e0338a', beak:'#4de3ff', beakTip:'#0a0a14',\n    leg:'#ff4fa3', glass:'#06040c', glassRim:'#4de3ff',\n    brass:'#ffd25e', metal:'#9fb6ff', wood:'#4a3d7a', woodDark:'#332a5c',\n    white:'#e8e9ff', dark:'#12101f', accent:'#8a5bff', plastic:'#1c1833', head:'#d6d4f0' },\n  classic: { label:'Classic', bg:'#f3e9df',\n    body:'#f79ac0', belly:'#ffd3e2', wing:'#ec7ba6', beak:'#f2a15c', beakTip:'#241f22',\n    leg:'#ef8fb1', glass:'#1b181e', glassRim:'#2c282e',\n    brass:'#e6b23c', metal:'#c9cdd2', wood:'#7a5136', woodDark:'#5b3d29',\n    white:'#f2ece0', dark:'#26232a', accent:'#ff5d8f', plastic:'#2d2a31', head:'#efe8db' },\n  neon: { label:'Neon', bg:'#160f26',\n    body:'#ff2d95', belly:'#ff79bf', wing:'#d61f7c', beak:'#00e6cb', beakTip:'#0a0a14',\n    leg:'#ff2d95', glass:'#06040c', glassRim:'#00e6cb',\n    brass:'#ffcf46', metal:'#8af6ff', wood:'#3a2b5c', woodDark:'#281d44',\n    white:'#eae6ff', dark:'#0a0a14', accent:'#17e6d4', plastic:'#241a3d', head:'#d8d2ff' },\n  tropical: { label:'Tropical', bg:'#e9f6ef',\n    body:'#ff8a6b', belly:'#ffd8b2', wing:'#ee6a4c', beak:'#ffb03b', beakTip:'#2a2320',\n    leg:'#ff8a6b', glass:'#1f302d', glassRim:'#2fd0c6',\n    brass:'#e8a23a', metal:'#bfe3dd', wood:'#a9744b', woodDark:'#7c5233',\n    white:'#fbf6ec', dark:'#28211c', accent:'#2fd0c6', plastic:'#1f5c56', head:'#f7efe1' }\n};\nfunction buildMaterials(p){\n  const sm = (n,c,ro,me)=>{ const m=new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:ro,metalness:me||0,flatShading:LOWPOLY}); m.name=n; return m; };\n  return {\n    body:sm('flamingo_body',p.body,0.72,0), belly:sm('flamingo_belly',p.belly,0.8,0),\n    wing:sm('flamingo_wing',p.wing,0.72,0), beak:sm('beak',p.beak,0.5,0.05),\n    beakTip:sm('beak_tip',p.beakTip,0.4,0.1), leg:sm('flamingo_leg',p.leg,0.6,0),\n    glass:sm('sunglass_lens',p.glass,0.12,0.3), glassRim:sm('sunglass_frame',p.glassRim,0.35,0.25),\n    brass:sm('brass',p.brass,0.28,0.35), metal:sm('chrome',p.metal,0.3,0.35),\n    wood:sm('wood',p.wood,0.5,0), woodDark:sm('wood_dark',p.woodDark,0.5,0),\n    white:sm('key_white',p.white,0.5,0), dark:sm('key_black',p.dark,0.42,0.12),\n    accent:sm('accent',p.accent,0.5,0), plastic:sm('plastic',p.plastic,0.5,0.05),\n    head:sm('drum_head',p.head,0.6,0), riser:sm('stage_riser',p.woodDark,0.55,0)\n  };\n}\n\n/* ---------- geometry helpers ---------- */\nconst V = (x,y,z)=>new THREE.Vector3(x,y,z);\nfunction mesh(geo,mat,name){ const m=new THREE.Mesh(geo,mat); if(name) m.name=name; return m; }\nfunction sphere(r,mat,name,ws=24,hs=18){ return mesh(new THREE.SphereGeometry(r,SEG(ws),SEG(hs)),mat,name); }\nfunction box(w,h,d,mat,name){ return mesh(new THREE.BoxGeometry(w,h,d),mat,name); }\nfunction cyl(rt,rb,h,mat,name,seg=24,open=false){ return mesh(new THREE.CylinderGeometry(rt,rb,h,SEG(seg),1,open),mat,name); }\nfunction tubeBetween(a,b,r,mat,name,seg=16){\n  const dir=new THREE.Vector3().subVectors(b,a); const len=dir.length()||1e-4;\n  const m=mesh(new THREE.CylinderGeometry(r,r,len,SEG(seg)),mat,name);\n  m.position.copy(a).add(b).multiplyScalar(0.5);\n  m.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize());\n  return m;\n}\nfunction joint(name){ const g=new THREE.Group(); g.name=name; return g; }\nfunction segDown(len,rTop,rBot,mat,name){ const m=mesh(new THREE.CylinderGeometry(rBot,rTop,len,16),mat,name); m.position.y=-len/2; return m; }\nfunction segUp(len,rBot,rTop,mat,name){ const m=mesh(new THREE.CylinderGeometry(rTop,rBot,len,16),mat,name); m.position.y=len/2; return m; }\nconst clamp01=x=>Math.max(0,Math.min(1,x));\n\n/* ================= ARTICULATED FLAMINGO ================= */\nfunction buildFlamingo(M, opts={}){\n  const root=new THREE.Group(); root.name='flamingo';\n  const J={ neck:[] };\n\n  /* ---- legs (planted, jointed) ---- */\n  function buildLeg(sign){\n    const hip=joint('hip'); hip.position.set(sign*0.1,0.9,-0.02); root.add(hip);\n    hip.add(segDown(0.34,0.042,0.034,M.leg,'thigh'));\n    const knee=joint('knee'); knee.position.y=-0.34; hip.add(knee);\n    knee.add(sphere(0.04,M.leg,'knee_ball',14,10));\n    knee.add(segDown(0.42,0.032,0.028,M.leg,'shank'));\n    const ankle=joint('ankle'); ankle.position.y=-0.42; knee.add(ankle);\n    ankle.add(sphere(0.033,M.leg,'ankle_ball',12,10));\n    const foot=joint('foot'); ankle.add(foot);\n    const sole=box(0.12,0.03,0.18,M.leg,'foot'); sole.position.set(0,-0.015,0.05); foot.add(sole);\n    for(let i=-1;i<=1;i++){ const toe=box(0.028,0.02,0.11,M.leg,'toe'); toe.position.set(i*0.033,-0.012,0.13); foot.add(toe); }\n    hip.rotation.x=0.14; knee.rotation.x=-0.28; ankle.rotation.x=0.14;\n    return {hip,knee,ankle,foot};\n  }\n  J.legR=buildLeg(1); J.legL=buildLeg(-1);\n\n  /* ---- pelvis / upper body (dances) ---- */\n  const pelvis=joint('pelvis'); pelvis.position.set(0,0.92,0); root.add(pelvis); J.pelvis=pelvis;\n  const torso=joint('torso'); pelvis.add(torso); J.torso=torso;\n  const body=sphere(0.33,M.body,'body'); body.scale.set(1.28,0.98,1.02); body.position.set(-0.02,0.02,0); torso.add(body);\n  const belly=sphere(0.27,M.belly,'belly'); belly.scale.set(1.06,0.62,0.9); belly.position.set(0,-0.14,0.06); torso.add(belly);\n\n  /* ---- wing-arms ---- */\n  function buildArm(sign){\n    const sh=joint('shoulder'); sh.position.set(sign*0.25,0.1,0.0); torso.add(sh);\n    const up=segDown(0.26,0.075,0.055,M.wing,'upperwing'); up.scale.set(1.1,1,2.1); sh.add(up);\n    const elbow=joint('elbow'); elbow.position.y=-0.26; sh.add(elbow);\n    const eb=sphere(0.055,M.wing,'elbow_ball',12,10); eb.scale.set(1,1,2.0); elbow.add(eb);\n    const fore=segDown(0.24,0.055,0.03,M.wing,'forewing'); fore.scale.set(1.05,1,2.0); elbow.add(fore);\n    const hand=joint('hand'); hand.position.y=-0.24; elbow.add(hand); // wrist: full 3-DOF (x=flex, y=twist, z=wave)\n    const palm=sphere(0.045,M.wing,'palm',12,10); palm.scale.set(0.9,1.1,0.5); palm.position.y=-0.03; hand.add(palm);\n    const fingers=[];\n    for(let fi=0;fi<3;fi++){\n      const fj=joint('finger'+fi); fj.position.set((fi-1)*0.026,-0.07,0.008); hand.add(fj);\n      const seg1=segDown(0.055,0.013,0.011,M.wing,'finger_seg1'); fj.add(seg1);\n      const fk=joint('knuckle'); fk.position.y=-0.055; fj.add(fk);\n      const seg2=segDown(0.045,0.011,0.008,M.wing,'finger_seg2'); fk.add(seg2);\n      const ftip=sphere(0.011,M.wing,'finger_tip',8,6); ftip.position.y=-0.045; fk.add(ftip);\n      fj.rotation.x=0.22+fi*0.05; fk.rotation.x=0.3;\n      fingers.push({fj,fk});\n    }\n    const thumb=joint('thumb'); thumb.position.set(sign*-0.038,-0.035,0.015); hand.add(thumb);\n    const tseg=segDown(0.05,0.013,0.009,M.wing,'thumb_seg'); thumb.add(tseg);\n    const ttip=sphere(0.011,M.wing,'thumb_tip',8,6); ttip.position.y=-0.05; thumb.add(ttip);\n    thumb.rotation.set(0.4,0,sign*-0.85);\n    hand.userData.fingers=fingers; hand.userData.thumb=thumb;\n    sh.rotation.set(0.15,0,sign*0.28); elbow.rotation.x=0.25;\n    return {shoulder:sh,elbow,hand};\n  }\n  J.armR=buildArm(1); J.armL=buildArm(-1);\n\n  /* ---- tail ---- */\n  const tail=joint('tail'); tail.position.set(-0.34,0.06,-0.03); torso.add(tail); J.tail=tail;\n  for(let i=0;i<3;i++){ const t=segDown(0.3,0.02,0.07,M.wing,'tail_'+i); t.position.y=0; const w=joint('tw'); w.rotation.set(2.0,0,(i-1)*0.18); w.add(t); tail.add(w); }\n\n  /* ---- neck chain + head ---- */\n  const nb=joint('neck0'); nb.position.set(0.05,0.24,0.06); torso.add(nb);\n  nb.add(segUp(0.19,0.066,0.06,M.body,'neckseg0'));\n  const n1=joint('neck1'); n1.position.y=0.19; nb.add(n1);\n  n1.add(segUp(0.19,0.06,0.056,M.body,'neckseg1'));\n  const n2=joint('neck2'); n2.position.y=0.19; n1.add(n2);\n  n2.add(segUp(0.17,0.056,0.055,M.body,'neckseg2'));\n  const head=joint('head'); head.position.y=0.17; n2.add(head); J.head=head;\n  J.neck=[nb,n1,n2];\n  nb.rotation.x=-0.42; n1.rotation.x=0.32; n2.rotation.x=0.5;\n  // head assembly\n  head.add(sphere(0.14,M.body,'head'));\n  const beak=cyl(0.02,0.095,0.26,M.beak,'beak',20); beak.position.set(0,-0.02,0.18); beak.rotation.x=Math.PI/2+0.34; head.add(beak);\n  const beakTip=cyl(0.001,0.05,0.13,M.beakTip,'beak_tip',18); beakTip.position.set(0,-0.1,0.29); beakTip.rotation.x=Math.PI/2+1.15; head.add(beakTip);\n  const sg=new THREE.Group(); sg.position.set(0,0.05,0.078); sg.rotation.x=-0.12; head.add(sg);\n  for(const s of [1,-1]){\n    const lens=sphere(0.062,M.glass,'lens',18,14); lens.scale.set(1.12,0.9,0.42); lens.position.set(s*0.072,0,0.078); sg.add(lens);\n    const rim=mesh(new THREE.TorusGeometry(0.062,0.012,10,22),M.glassRim,'lens_rim'); rim.scale.set(1.12,0.9,1); rim.position.set(s*0.072,0,0.088); sg.add(rim);\n    sg.add(tubeBetween(V(s*0.13,0.01,0.06),V(s*0.14,0.02,-0.09),0.01,M.glassRim,'arm'));\n  }\n  sg.add(box(0.055,0.016,0.02,M.glassRim,'bridge')); sg.children[sg.children.length-1].position.set(0,0.012,0.1);\n\n  // neutral pose snapshot (dance adds deltas on top)\n  J.base={\n    pelvisY:pelvis.position.y, torsoZ:torso.rotation.z, torsoX:torso.rotation.x, torsoY:torso.rotation.y,\n    headX:head.rotation.x, headZ:head.rotation.z,\n    shRz:J.armR.shoulder.rotation.z, shLz:J.armL.shoulder.rotation.z,\n    shRx:J.armR.shoulder.rotation.x, shLx:J.armL.shoulder.rotation.x,\n    elRx:J.armR.elbow.rotation.x, elLx:J.armL.elbow.rotation.x,\n    kneeR:J.legR.knee.rotation.x, kneeL:J.legL.knee.rotation.x,\n    hipR:J.legR.hip.rotation.x, hipL:J.legL.hip.rotation.x,\n    n0z:0,n1z:0,n2z:0\n  };\n  root.userData.J=J;\n  return root;\n}\n\n// re-snapshot base after a builder re-poses arms/neck for holding an instrument\nfunction rebase(J){\n  const b=J.base;\n  b.shRz=J.armR.shoulder.rotation.z; b.shLz=J.armL.shoulder.rotation.z;\n  b.shRx=J.armR.shoulder.rotation.x; b.shLx=J.armL.shoulder.rotation.x;\n  b.elRx=J.armR.elbow.rotation.x; b.elLx=J.armL.elbow.rotation.x;\n  b.torsoX=J.torso.rotation.x; b.headX=J.head.rotation.x;\n}\n\n/* ---------- dance driver ---------- */\nfunction danceRig(J, t, o={}){\n  const sp=(o.speed||1)*(audioPlaying?(0.7+AUDIO.level*0.9):1),\n        amp=(o.amp==null?1:o.amp)*(audioPlaying?(0.45+AUDIO.level*2.4):1),\n        ph=o.phase||0, b=J.base;\n  const s=Math.sin(t*3.0*sp+ph), s2=Math.sin(t*3.0*sp+ph+Math.PI/2), slow=Math.sin(t*1.3*sp+ph);\n  J.pelvis.position.y = b.pelvisY + Math.abs(s)*0.045*amp - 0.015*amp;\n  J.torso.rotation.z = b.torsoZ + s2*0.07*amp;\n  J.torso.rotation.y = b.torsoY + slow*0.06*amp;\n  J.torso.rotation.x = b.torsoX + Math.abs(s)*0.02;\n  // neck sway + head bob\n  J.neck[0].rotation.z = s2*0.05*amp; J.neck[1].rotation.z = -s2*0.04*amp; J.neck[2].rotation.z = s2*0.05*amp;\n  J.head.rotation.x = b.headX + s*0.12*amp;\n  J.head.rotation.z = b.headZ + s2*0.08*amp;\n  J.tail.rotation.y = s2*0.22*amp;\n  // knee groove (feet planted)\n  J.legR.knee.rotation.x = b.kneeR - clamp01(s)*0.09*amp;\n  J.legL.knee.rotation.x = b.kneeL - clamp01(-s)*0.09*amp;\n  J.legR.hip.rotation.x = b.hipR + clamp01(s)*0.05*amp;\n  J.legL.hip.rotation.x = b.hipL + clamp01(-s)*0.05*amp;\n  if(o.freeArms){\n    J.armR.shoulder.rotation.z = b.shRz + s*0.35*amp;\n    J.armL.shoulder.rotation.z = b.shLz - s*0.35*amp;\n    J.armR.shoulder.rotation.x = b.shRx + s2*0.15;\n    J.armL.shoulder.rotation.x = b.shLx + s2*0.15;\n    J.armR.elbow.rotation.x = b.elRx + (0.4+0.3*s);\n    J.armL.elbow.rotation.x = b.elLx + (0.4-0.3*s);\n    J.armR.hand.rotation.set(s2*0.3,s*0.25,s2*0.2);\n    J.armL.hand.rotation.set(-s2*0.3,-s*0.25,-s2*0.2);\n    [J.armR,J.armL].forEach((arm,ai)=>{ (arm.hand.userData.fingers||[]).forEach((f,i)=>{ f.fj.rotation.x=0.25+Math.max(0,Math.sin(t*3.0*sp+ph+ai*Math.PI+i*0.8))*0.5; f.fk.rotation.x=0.3+Math.max(0,s)*0.4; }); });\n  }\n  return {s,s2,slow};\n}\n\n/* ================= INSTRUMENTS ================= */\nfunction drum(r,h,shellMat,headMat,rimMat,name){\n  const d=new THREE.Group(); d.name=name;\n  d.add(cyl(r,r,h,shellMat,name+'_shell',32,false));\n  const top=cyl(r*1.02,r*1.02,0.015,headMat,name+'_head_top',32); top.position.y=h/2; d.add(top);\n  const bot=cyl(r*1.02,r*1.02,0.015,headMat,name+'_head_bot',32); bot.position.y=-h/2; d.add(bot);\n  for(const yy of [h/2,-h/2]){ const rim=mesh(new THREE.TorusGeometry(r*1.03,0.014,10,36),rimMat,name+'_rim'); rim.rotation.x=Math.PI/2; rim.position.y=yy; d.add(rim); }\n  return d;\n}\nfunction cymbal(r,M,name){\n  const c=new THREE.Group(); c.name=name;\n  c.add(cyl(r,r,0.01,M.brass,name+'_disc',40));\n  const bell=sphere(r*0.22,M.brass,name+'_bell',16,12); bell.scale.y=0.6; bell.position.y=0.02; c.add(bell);\n  return c;\n}\nfunction standTo(M,base,top,name){\n  const g=new THREE.Group(); g.name=name;\n  g.add(tubeBetween(V(base.x,0.02,base.z),top,0.017,M.metal,name+'_pole',12));\n  for(let i=0;i<3;i++){ const a=i/3*Math.PI*2; g.add(tubeBetween(V(base.x,0.14,base.z),V(base.x+Math.cos(a)*0.16,0.01,base.z+Math.sin(a)*0.16),0.012,M.metal,name+'_leg',8)); }\n  return g;\n}\nfunction buildDrums(M){\n  const g=new THREE.Group(); g.name='drum_kit';\n  const bass=drum(0.36,0.4,M.accent,M.head,M.metal,'bass_drum'); bass.rotation.x=Math.PI/2; bass.position.set(0,0.37,0); g.add(bass);\n  const spur=(s)=>{ g.add(tubeBetween(V(s*0.22,0.36,0.18),V(s*0.3,0.02,0.42),0.014,M.metal,'spur',8)); }; spur(1); spur(-1);\n  const snare=drum(0.17,0.13,M.metal,M.head,M.metal,'snare'); snare.position.set(-0.42,0.56,0.28); snare.rotation.z=0.05; g.add(snare);\n  g.add(standTo(M,{x:-0.42,z:0.28},V(-0.42,0.49,0.28),'snare_stand'));\n  const t1=drum(0.13,0.15,M.accent,M.head,M.metal,'tom1'); t1.position.set(-0.14,0.78,-0.02); t1.rotation.x=-0.5; g.add(t1);\n  const t2=drum(0.15,0.16,M.accent,M.head,M.metal,'tom2'); t2.position.set(0.17,0.78,-0.02); t2.rotation.x=-0.45; g.add(t2);\n  g.add(tubeBetween(V(0,0.55,-0.02),V(0,0.86,-0.05),0.016,M.metal,'tom_mount',10));\n  const ft=drum(0.2,0.28,M.accent,M.head,M.metal,'floor_tom'); ft.position.set(0.5,0.44,0.14); g.add(ft);\n  for(let i=0;i<3;i++){ const a=i/3*Math.PI*2+0.5; g.add(tubeBetween(V(0.5+Math.cos(a)*0.18,0.44,0.14+Math.sin(a)*0.18),V(0.5+Math.cos(a)*0.2,0.01,0.14+Math.sin(a)*0.2),0.012,M.metal,'ft_leg',8)); }\n  const hhTop=cymbal(0.16,M,'hihat_top'); hhTop.position.set(-0.62,0.62,-0.05); g.add(hhTop);\n  const hhBot=cymbal(0.16,M,'hihat_bot'); hhBot.position.set(-0.62,0.58,-0.05); g.add(hhBot);\n  g.add(standTo(M,{x:-0.62,z:-0.05},V(-0.62,0.58,-0.05),'hihat_stand'));\n  const crash=cymbal(0.21,M,'crash'); crash.position.set(-0.34,0.96,-0.28); crash.rotation.z=0.28; g.add(crash);\n  g.add(standTo(M,{x:-0.34,z:-0.28},V(-0.34,0.95,-0.28),'crash_stand'));\n  const ride=cymbal(0.25,M,'ride'); ride.position.set(0.45,0.88,-0.3); ride.rotation.z=-0.24; g.add(ride);\n  g.add(standTo(M,{x:0.45,z:-0.3},V(0.45,0.87,-0.3),'ride_stand'));\n  return g;\n}\nfunction buildSax(M){\n  const g=new THREE.Group(); g.name='saxophone';\n  g.add((()=>{const b=cyl(0.05,0.075,0.72,M.brass,'sax_body',24); b.position.set(0,0.62,0); return b;})());\n  const ubend=mesh(new THREE.TorusGeometry(0.1,0.058,16,24,Math.PI),M.brass,'sax_ubend'); ubend.position.set(0.1,0.26,0); ubend.rotation.set(0,0,Math.PI); g.add(ubend);\n  const bellPts=[]; for(let i=0;i<=10;i++){ const t=i/10; bellPts.push(new THREE.Vector2(0.058+Math.pow(t,2.2)*0.13, t*0.52)); }\n  const bell=mesh(new THREE.LatheGeometry(bellPts,28),M.brass,'sax_bell'); bell.position.set(0.2,0.26,0); bell.rotation.z=-0.28; g.add(bell);\n  const bellRim=mesh(new THREE.TorusGeometry(0.188,0.014,12,28),M.brass,'sax_bell_rim'); bellRim.position.set(0.34,0.73,0); bellRim.rotation.set(Math.PI/2,0,-0.28); g.add(bellRim);\n  const neckCurve=new THREE.CatmullRomCurve3([V(0,0.98,0),V(-0.02,1.08,0.03),V(-0.09,1.13,0.02),V(-0.16,1.12,0)]);\n  g.add(mesh(new THREE.TubeGeometry(neckCurve,20,0.03,14,false),M.brass,'sax_neck'));\n  const mp=cyl(0.028,0.02,0.09,M.dark,'mouthpiece',16); mp.position.set(-0.2,1.11,0); mp.rotation.z=Math.PI/2+0.15; g.add(mp);\n  for(let i=0;i<8;i++){ const y=0.34+i*0.075; const cup=cyl(0.03,0.03,0.016,M.brass,'key_cup',14); cup.position.set(0.055,y,0.03); cup.rotation.x=Math.PI/2; g.add(cup);\n    if(i%2===0){ const touch=cyl(0.016,0.016,0.01,M.white,'key_touch',12); touch.position.set(0.02,y+0.02,0.09); touch.rotation.x=Math.PI/2; g.add(touch); } }\n  g.add(tubeBetween(V(0.05,0.32,0.05),V(0.05,0.95,0.05),0.008,M.metal,'key_rod',8));\n  return g;\n}\nfunction buildKeyboard(M,withStand=true){\n  const g=new THREE.Group(); g.name='keyboard';\n  const topY=withStand?0.72:0.06;\n  const bodyG=new THREE.Group(); bodyG.position.y=topY; g.add(bodyG);\n  bodyG.add(box(0.98,0.1,0.34,M.plastic,'synth_body'));\n  const face=box(0.98,0.03,0.14,M.dark,'control_panel'); face.position.set(0,0.055,-0.09); bodyG.add(face);\n  const nWhite=17, kw=0.9/nWhite;\n  for(let i=0;i<nWhite;i++){ const k=box(kw*0.92,0.03,0.16,M.white,'white_key'); k.position.set(-0.45+kw*(i+0.5),0.05,0.07); bodyG.add(k); }\n  const blackAfter=[0,1,3,4,5];\n  for(let i=0;i<nWhite-1;i++){ if(blackAfter.includes(i%7)){ const k=box(kw*0.55,0.035,0.1,M.dark,'black_key'); k.position.set(-0.45+kw*(i+1),0.07,0.04); bodyG.add(k); } }\n  for(let i=0;i<5;i++){ const kn=cyl(0.022,0.026,0.03,M.accent,'knob',16); kn.position.set(-0.42+i*0.09,0.075,-0.12); bodyG.add(kn); }\n  for(let i=0;i<3;i++){ const sl=box(0.02,0.012,0.08,M.metal,'slider'); sl.position.set(-0.02+i*0.06,0.072,-0.1); bodyG.add(sl); }\n  const screen=box(0.2,0.012,0.08,M.glass,'screen'); screen.position.set(0.34,0.072,-0.11); bodyG.add(screen);\n  if(withStand){\n    for(const cx of [-0.3,0.3]){\n      g.add(tubeBetween(V(cx,0.02,-0.2),V(cx,topY-0.05,0.16),0.02,M.metal,'stand_leg',10));\n      g.add(tubeBetween(V(cx,0.02,0.2),V(cx,topY-0.05,-0.16),0.02,M.metal,'stand_leg',10));\n      g.add(tubeBetween(V(cx,0.02,-0.24),V(cx,0.02,0.24),0.018,M.metal,'stand_foot',8));\n    }\n    g.add(tubeBetween(V(-0.34,topY-0.05,0.15),V(0.34,topY-0.05,0.15),0.016,M.metal,'stand_top',8));\n    g.add(tubeBetween(V(-0.34,topY-0.05,-0.15),V(0.34,topY-0.05,-0.15),0.016,M.metal,'stand_top',8));\n  }\n  return g;\n}\nfunction pianoShape(){\n  const s=new THREE.Shape();\n  s.moveTo(0,0); s.lineTo(1.4,0);\n  s.bezierCurveTo(1.72,0.72,1.5,1.72,0.58,2.0);\n  s.quadraticCurveTo(0.02,2.06,0,1.68); s.lineTo(0,0); s.closePath(); return s;\n}\nfunction buildPiano(M){\n  const g=new THREE.Group(); g.name='grand_piano';\n  const legH=0.62, bodyH=0.3, topY=legH+bodyH; const shape=pianoShape();\n  const body=mesh(new THREE.ExtrudeGeometry(shape,{depth:bodyH,bevelEnabled:true,bevelThickness:0.015,bevelSize:0.015,bevelSegments:2,steps:1}),M.dark,'piano_body');\n  body.rotation.x=-Math.PI/2; body.position.y=legH; g.add(body);\n  const sb=mesh(new THREE.ExtrudeGeometry(shape,{depth:0.01,bevelEnabled:false}),M.wood,'soundboard'); sb.rotation.x=-Math.PI/2; sb.scale.set(0.9,0.9,1); sb.position.set(0.07,topY+0.001,-0.05); g.add(sb);\n  const plate=mesh(new THREE.ExtrudeGeometry(shape,{depth:0.006,bevelEnabled:false}),M.brass,'plate'); plate.rotation.x=-Math.PI/2; plate.scale.set(0.55,0.62,1); plate.position.set(0.5,topY+0.006,-0.5); g.add(plate);\n  const lidPivot=new THREE.Group(); lidPivot.position.set(0,topY+0.012,0); g.add(lidPivot);\n  const lid=mesh(new THREE.ExtrudeGeometry(shape,{depth:0.022,bevelEnabled:true,bevelThickness:0.008,bevelSize:0.008,bevelSegments:1,steps:1}),M.dark,'lid'); lid.rotation.x=-Math.PI/2; lidPivot.add(lid); lidPivot.rotation.z=0.92;\n  g.add(tubeBetween(V(1.02,topY,-0.42),V(0.86,topY+0.5,-0.42),0.014,M.wood,'lid_stick',8));\n  for(const [x,z] of [[0.13,-0.08],[1.26,-0.16],[0.5,-1.7]]){ const leg=cyl(0.035,0.052,legH,M.dark,'leg',16); leg.position.set(x,legH/2,z); g.add(leg);\n    const wheel=cyl(0.055,0.055,0.04,M.dark,'wheel',14); wheel.rotation.z=Math.PI/2; wheel.position.set(x,0.03,z); g.add(wheel); }\n  const kbY=legH+bodyH-0.06, x0=0.16, x1=1.24, span=x1-x0;\n  g.add((()=>{const b=box(span+0.08,0.06,0.2,M.dark,'keybed'); b.position.set((x0+x1)/2,kbY,0.12); return b;})());\n  const fall=box(span+0.08,0.06,0.05,M.dark,'fallboard'); fall.position.set((x0+x1)/2,kbY+0.06,0.03); fall.rotation.x=-0.5; g.add(fall);\n  const nWhite=22, kw=span/nWhite;\n  for(let i=0;i<nWhite;i++){ const k=box(kw*0.9,0.028,0.17,M.white,'white_key'); k.position.set(x0+kw*(i+0.5),kbY+0.03,0.14); g.add(k); }\n  const blackAfter=[0,1,3,4,5];\n  for(let i=0;i<nWhite-1;i++){ if(blackAfter.includes(i%7)){ const k=box(kw*0.55,0.03,0.1,M.dark,'black_key'); k.position.set(x0+kw*(i+1),kbY+0.048,0.11); g.add(k); } }\n  const desk=box(0.5,0.22,0.02,M.dark,'music_desk'); desk.position.set(0.6,kbY+0.2,0.0); desk.rotation.x=-0.35; g.add(desk);\n  return g;\n}\nfunction buildTambourine(M){\n  const g=new THREE.Group(); g.name='tambourine'; const R=0.17;\n  g.add(cyl(R,R,0.07,M.wood,'frame',40,true));\n  g.add(cyl(R-0.012,R-0.012,0.071,M.woodDark,'frame_inner',40,true));\n  const head=cyl(R-0.01,R-0.01,0.006,M.head,'head'); head.position.y=0.03; g.add(head);\n  const topRim=mesh(new THREE.TorusGeometry(R,0.01,10,40),M.woodDark,'top_rim'); topRim.rotation.x=Math.PI/2; topRim.position.y=0.035; g.add(topRim);\n  const n=8;\n  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, x=Math.cos(a)*(R-0.006), z=Math.sin(a)*(R-0.006);\n    g.add(tubeBetween(V(x,-0.02,z),V(x,0.02,z),0.004,M.metal,'jingle_pin',6));\n    for(const off of [-0.012,0.012]){ const j=cyl(0.028,0.028,0.004,M.brass,'jingle',16); j.position.set(x,off,z); g.add(j); } }\n  return g;\n}\nfunction drumstick(M){ const s=new THREE.Group(); s.add(segDown(0.3,0.011,0.016,M.wood,'stick')); const tip=sphere(0.02,M.wood,'stick_tip',10,8); tip.position.y=-0.3; s.add(tip); return s; }\n\n/* ================= PLAYERS (flamingo + instrument, posed, animated) ================= */\nfunction makePlayer(M, kind, opts={}){\n  const fl=buildFlamingo(M,{}); const J=fl.userData.J;\n  const grp=new THREE.Group(); grp.name='player_'+kind; grp.add(fl);\n  let extraTick=null;\n\n  const armTo=(arm,shX,shZ,elX)=>{ arm.shoulder.rotation.set(shX,0,shZ); arm.elbow.rotation.x=elX; };\n  const _q1=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_qw=new THREE.Quaternion(),_v=new THREE.Vector3(),_dn=V(0,-1,0);\n  const aimHand=(arm,dir)=>{ arm.elbow.updateWorldMatrix(true,false);\n    arm.elbow.getWorldQuaternion(_q1); fl.getWorldQuaternion(_q2);\n    _v.copy(dir).applyQuaternion(_q2).normalize();\n    _qw.setFromUnitVectors(_dn,_v);\n    arm.hand.quaternion.copy(_q1.invert().multiply(_qw)); };\n\n  const curl=(hand,amt,spread)=>{ (hand.userData.fingers||[]).forEach((f,i)=>{\n    f.fj.rotation.x=0.2+amt*0.9+i*0.04; f.fk.rotation.x=0.28+amt*1.0;\n    f.fj.rotation.z=(i-1)*(spread==null?0.06:spread); }); };\n\n  if(kind==='solo'){\n    // just dancing, wings free\n  }\n  else if(kind==='sax'){\n    const sax=buildSax(M); sax.scale.setScalar(0.82); sax.position.set(0.16,0.34,0.26); sax.rotation.set(0.15,0.15,0.05); fl.add(sax);\n    J.armR.shoulder.position.set(0.28,0.1,0.14); J.armL.shoulder.position.set(-0.28,0.1,0.14);\n    armTo(J.armR,-1.25,-0.3,-0.5); armTo(J.armL,-1.15,0.4,-0.65);\n    J.neck[0].rotation.x=-0.15; J.neck[2].rotation.x=0.75; J.head.rotation.x=0.25; J.base.headX=0.25;\n    curl(J.armR.hand,0.75,0.1); curl(J.armL.hand,0.75,0.1);\n    J.armR.hand.rotation.y=0.4; J.armL.hand.rotation.y=-0.4;\n    rebase(J);\n    extraTick=(t)=>{ const w=Math.sin(t*10);\n      aimHand(J.armR,_v0.set(0.35,-0.35+w*0.06,0.85)); aimHand(J.armL,_v1.set(-0.35,-0.35-w*0.06,0.85));\n      (J.armL.hand.userData.fingers||[]).forEach((f,i)=>{ f.fj.rotation.x=0.85+Math.sin(t*10+i*2.1)*0.3; }); };\n  }\n  else if(kind==='tamb'){\n    const tamb=buildTambourine(M); tamb.scale.setScalar(0.9); tamb.rotation.x=1.2; J.armR.hand.add(tamb); tamb.position.set(0,-0.05,0.02);\n    armTo(J.armR,-1.9,-0.2,0.5); armTo(J.armL,0.5,0.7,0.7);\n    curl(J.armR.hand,0.85,0.04); curl(J.armL.hand,0.3,0.12); J.armR.hand.rotation.y=0.3;\n    rebase(J);\n    extraTick=(t)=>{ const sh=Math.sin(t*16); J.armR.elbow.rotation.x=0.5+sh*0.25; J.armR.hand.rotation.z=sh*0.2; };\n  }\n  else if(kind==='keys'){\n    const kb=buildKeyboard(M,true); kb.scale.setScalar(0.92); kb.position.set(0,0,0.34); kb.rotation.y=Math.PI; fl.add(kb);\n    J.torso.rotation.x=0.28; J.base.torsoX=0.28;\n    J.armR.shoulder.position.set(0.3,0.12,0.16); J.armL.shoulder.position.set(-0.3,0.12,0.16);\n    armTo(J.armR,-1.45,-0.22,-0.1); armTo(J.armL,-1.45,0.22,-0.1);\n    J.neck[0].rotation.x=-0.05; J.head.rotation.x=0.35; J.base.headX=0.35;\n    curl(J.armR.hand,0.15,0.16); curl(J.armL.hand,0.15,0.16);\n    rebase(J);\n    extraTick=(t)=>{ aimHand(J.armR,_v0.set(0.1,-0.8+Math.sin(t*9)*0.12,0.6)); aimHand(J.armL,_v1.set(-0.1,-0.8+Math.sin(t*9+1.4)*0.12,0.6));\n      [J.armR,J.armL].forEach((arm,ai)=>{ (arm.hand.userData.fingers||[]).forEach((f,i)=>{ f.fj.rotation.x=0.3+Math.max(0,Math.sin(t*9+ai*1.4+i*1.9))*0.55; }); }); };\n  }\n  else if(kind==='drums'){\n    const kit=buildDrums(M); kit.scale.setScalar(0.8); kit.position.set(0,0,0.4); kit.rotation.y=Math.PI; fl.add(kit);\n    J.torso.rotation.x=0.3; J.base.torsoX=0.3;\n    J.armR.shoulder.position.set(0.34,0.08,0.05); J.armL.shoulder.position.set(-0.34,0.08,0.05);\n    armTo(J.armR,0.2,0.95,-0.6); armTo(J.armL,0.2,-0.95,-0.6);\n    const stR=drumstick(M); stR.rotation.x=-0.4; J.armR.hand.add(stR);\n    const stL=drumstick(M); stL.rotation.x=-0.4; J.armL.hand.add(stL);\n    curl(J.armR.hand,0.95,0.02); curl(J.armL.hand,0.95,0.02);\n    J.neck[2].rotation.x=0.3; J.head.rotation.x=0.3; J.base.headX=0.3;\n    rebase(J);\n    extraTick=(t)=>{ const a=Math.sin(t*11), b=Math.sin(t*11+Math.PI);\n      J.armR.shoulder.rotation.x=0.2+Math.max(0,a)*0.9; J.armL.shoulder.rotation.x=0.2+Math.max(0,b)*0.9; };\n  }\n  else if(kind==='piano'){\n    const pf=buildPiano(M); pf.scale.setScalar(0.7);\n    pf.position.set(0.49,0,0.42); pf.rotation.y=Math.PI; fl.add(pf);\n    J.torso.rotation.x=0.34; J.base.torsoX=0.34;\n    J.armR.shoulder.position.set(0.3,0.12,0.16); J.armL.shoulder.position.set(-0.3,0.12,0.16);\n    armTo(J.armR,-1.5,-0.2,-0.1); armTo(J.armL,-1.5,0.2,-0.1);\n    J.neck[2].rotation.x=0.35; J.head.rotation.x=0.42; J.base.headX=0.42;\n    curl(J.armR.hand,0.2,0.16); curl(J.armL.hand,0.2,0.16);\n    rebase(J);\n    extraTick=(t)=>{ aimHand(J.armR,_v0.set(0.1,-0.8+Math.sin(t*8)*0.12,0.6)); aimHand(J.armL,_v1.set(-0.1,-0.8+Math.sin(t*8+1.1)*0.12,0.6));\n      [J.armR,J.armL].forEach( ind:'drums',x:0.5,   z:-1.05,rot:-0.22,phase:0.8}\n  ];\n  const ticks=[];\n  for(const m of memberDefs){ const pl=makePlayer(M,m.kind,{phase:m.phase,amp:0.95});\n    pl.group.position.set(m.x,topY,m.z); pl.group.rotation.y=m.rot; g.add(pl.group); ticks.push(pl.tick); }\n  // levitating spotlights (no truss — they float), aimed at the players\n  const spotCols=[p.accent,p.body,p.brass,p.accent];\n  const spotPivots=[];\n  const spotDefs=[[-1.7,2.6,-1.2,-1.12,0.34],[-0.6,3.0,-1.5,-0.28,-0.15],[0.6,3.0,-1.5,1.08,0.34],[1.7,2.6,-1.2,0.5,-1.05]];\n  spotDefs.forEach((d,i)=>{\n    const [sx,sy,sz,tx,tz]=d; const col=new THREE.Color(spotCols[i%4]);\n    const pivot=new THREE.Group(); pivot.name='spot_'+i; pivot.position.set(sx,sy,sz); g.add(pivot);\n    const orb=sphere(0.13,M.metal,'spot_orb',14,10); orb.position.y=0.06; pivot.add(orb);\n    const housing=cyl(0.1,0.14,0.22,M.dark,'spot_housing',14); housing.position.y=-0.11; pivot.add(housing);\n    const lensMat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.4,flatShading:LOWPOLY}); lensMat.name='spot_lens_'+i;\n    const lens=cyl(0.13,0.13,0.02,lensMat,'spot_lens',14); lens.position.y=-0.23; pivot.add(lens);\n    const beamLen=3.0;\n    const beamMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.13,depthWrite:false,side:THREE.DoubleSide}); beamMat.name='light_beam_'+i;\n    const beam=mesh(new THREE.CylinderGeometry(0.05,0.6,beamLen,SEG(20),1,true),beamMat,'beam'); beam.position.y=-0.24-beamLen/2; pivot.add(beam);\n    const dir=V(tx-sx,topY+0.6-sy,tz-sz).normalize();\n    pivot.quaternion.setFromUnitVectors(V(0,-1,0),dir);\n    pivot.userData={baseQ:pivot.quaternion.clone(),baseY:sy};\n    spotPivots.push(pivot);\n  });\n  // levitating camera drones orbiting the stage\n  const drones=[];\n  for(let i=0;i<4;i++){\n    const cam=new THREE.Group(); cam.name='camera_drone_'+i; g.add(cam);\n    const bodyC=box(0.22,0.16,0.3,M.plastic,'cam_body'); cam.add(bodyC);\n    const lensC=cyl(0.06,0.08,0.14,M.dark,'cam_lens',12); lensC.rotation.x=Math.PI/2; lensC.position.set(0,0,0.2); cam.add(lensC);\n    const glassC=cyl(0.055,0.055,0.015,M.glass,'cam_glass',12); glassC.rotation.x=Math.PI/2; glassC.position.set(0,0,0.275); cam.add(glassC);\n    const ledMat=new THREE.MeshStandardMaterial({color:new THREE.Color(p.accent),emissive:new THREE.Color(p.accent),emissiveIntensity:1.6,flatShading:LOWPOLY}); ledMat.name='cam_led_'+i;\n    const led=sphere(0.02,ledMat,'cam_led',8,6); led.position.set(0.08,0.1,0.1); cam.add(led);\n    for(const rx of [-0.14,0.14]) for(const rz of [-0.16,0.16]){ const rotor=cyl(0.07,0.07,0.012,M.metal,'rotor',10); rotor.position.set(rx,0.1,rz); cam.add(rotor); }\n    cam.userData={r:3.6+i*0.6, h:1.7+i*0.6, sp:0.32+i*0.09, ph:i*2.1};\n    drones.push(cam);\n  }\n  // cosmos: starfield points\n  const starGeo=new THREE.BufferGeometry(); const starN=420; const sp=new Float32Array(starN*3);\n  for(let i=0;i<starN;i++){ const R=7+Math.random()*7, th=Math.random()*Math.PI*2, ph2=Math.acos(2*Math.random()-1);\n    sp[i*3]=R*Math.sin(ph2)*Math.cos(th); sp[i*3+1]=R*Math.cos(ph2)*0.8+0.5; sp[i*3+2]=R*Math.sin(ph2)*Math.sin(th); }\n  starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));\n  const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.05,sizeAttenuation:true})); stars.name='stars'; g.add(stars);\n  // planets\n  const planets=[];\n  const mkPlanet=(r,c,x,y,z,ring)=>{ const pg=new THREE.Group(); pg.position.set(x,y,z); g.add(pg);\n    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:0.7,flatShading:LOWPOLY}); mat.name='planet';\n    pg.add(mesh(new THREE.SphereGeometry(r,SEG(20),SEG(14)),mat,'planet'));\n    if(ring){ const rg=mesh(new THREE.TorusGeometry(r*1.7,r*0.16,SEG(8),SEG(36)),new THREE.MeshStandardMaterial({color:new THREE.Color(ring),roughness:0.6,flatShading:LOWPOLY}),'planet_ring'); rg.rotation.x=Math.PI/2.4; pg.add(rg); }\n    pg.userData={spin:0.1+Math.random()*0.15}; planets.push(pg); return pg; };\n  mkPlanet(0.9,p.accent,-5.2,2.6,-4.5,p.brass);\n  mkPlanet(0.55,p.body,4.8,3.4,-3.8,null);\n  mkPlanet(0.35,p.brass,3.6,-1.6,4.2,null);\n  const moonMat=new THREE.MeshStandardMaterial({color:new THREE.Color(p.white),roughness:0.9,flatShading:LOWPOLY}); moonMat.name='moon';\n  const moon=mesh(new THREE.SphereGeometry(0.22,SEG(14),SEG(10)),moonMat,'moon'); moon.position.set(-3.8,-1.2,3.4); g.add(moon);\n  // comets with tails\n  const comets=[];\n  for(let i=0;i<2;i++){ const cg=new THREE.Group(); cg.name='comet_'+i; g.add(cg);\n    const headMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:new THREE.Color(p.accent),emissiveIntensity:0.8,flatShading:LOWPOLY}); headMat.name='comet_head';\n    cg.add(mesh(new THREE.SphereGeometry(0.12,SEG(10),SEG(8)),headMat,'comet_head'));\n    const tailMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.accent),transparent:true,opacity:0.35}); tailMat.name='comet_tail';\n    const tail=mesh(new THREE.ConeGeometry(0.09,1.6,SEG(8)),tailMat,'comet_tail'); tail.rotation.z=Math.PI/2; tail.position.x=0.85; cg.add(tail);\n    cg.userData={r:5.2+i*1.6, sp:0.22+i*0.1, ph:i*2.8, y:2.2-i*3.0};\n    comets.push(cg); }\n  // galaxy swirl: flat spiral of tiny spheres\n  const gal=new THREE.Group(); gal.name='galaxy'; gal.position.set(5.6,4.4,3.8); gal.rotation.x=0.9; g.add(gal);\n  const galMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.metal)}); galMat.name='galaxy_dot';\n  for(let i=0;i<46;i++){ const a=i*0.42, rr=0.06+i*0.028; const dot=mesh(new THREE.SphereGeometry(0.032+((i%5)?0:0.03),6,5),galMat,'gdot');\n    dot.position.set(Math.cos(a)*rr,(Math.random()-0.5)*0.06,Math.sin(a)*rr); gal.add(dot); }\n  // ---- speaker wall: arc of towers behind the stage, one per stem ----\n  const wall=new THREE.Group(); wall.name='speaker_wall'; g.add(wall);\n  const speakerCols=[];\n  const colCols=[p.accent,p.body,p.beak,p.brass,p.metal,p.wing];\n  const NCOL=6, arcR=5.3;\n  for(let ci=0;ci<NCOL;ci++){\n    const a=(-0.55+ci*(1.10/(NCOL-1)));\n    const cx=Math.sin(a)*arcR, cz=-Math.cos(a)*arcR+2.0;\n    const col=new THREE.Group(); col.name='speaker_col_'+ci; col.position.set(cx,0,cz); col.rotation.y=a; wall.add(col);\n    const colObj={cones:[],grp:col,baseY:0};\n    const hCabs=(ci===0||ci===NCOL-1)?3:(ci===1||ci===NCOL-2)?4:5;\n    let y=0.2;\n    for(let k=0;k<hCabs;k++){\n      const big=k<2, cw=big?1.05:0.9, chh=big?0.95:0.62;\n      const cab=box(cw,chh,0.62,M.plastic,'cabinet'); cab.position.set(0,y+chh/2,0); col.add(cab);\n      const face=box(cw*0.94,chh*0.92,0.03,M.dark,'cab_face'); face.position.set(0,y+chh/2,0.32); col.add(face);\n      const nW=big?1:2, wr=big?chh*0.34:0.14;\n      for(let wi=0;wi<nW;wi++){\n        const wy=y+chh/2+(nW>1?(wi-0.5)*chh*0.44:0);\n        const rim=mesh(new THREE.TorusGeometry(wr,0.028,SEG(8),SEG(24)),M.metal,'woofer_rim'); rim.position.set(0,wy,0.35); col.add(rim);\n        const coneMat=new THREE.MeshStandardMaterial({color:new THREE.Color(p.dark),roughness:0.5,flatShading:LOWPOLY}); coneMat.name='woofer_cone';\n        const cone=mesh(new THREE.ConeGeometry(wr*0.92,0.16,SEG(20)),coneMat,'woofer'); cone.rotation.x=-Math.PI/2; cone.position.set(0,wy,0.28); col.add(cone);\n        const capMat=new THREE.MeshStandardMaterial({color:new THREE.Color(colCols[ci%colCols.length]),emissive:new THREE.Color(colCols[ci%colCols.length]),emissiveIntensity:0.5,flatShading:LOWPOLY}); capMat.name='dust_cap';\n        const cap=sphere(wr*0.24,capMat,'dust_cap',10,8); cap.position.set(0,wy,0.34); col.add(cap);\n        colObj.cones.push({cone,cap,capMat,baseZ:0.28});\n      }\n      y+=chh+0.06;\n    }\n    const ledMat=new THREE.MeshStandardMaterial({color:new THREE.Color(colCols[ci%colCols.length]),emissive:new THREE.Color(colCols[ci%colCols.length]),emissiveIntensity:0.8,flatShading:LOWPOLY}); ledMat.name='col_led_'+ci;\n    for(const sx of [-1,1]){ const strip=box(0.05,y-0.2,0.05,ledMat,'led_strip'); pe.bezierCurveTo(0.35,0,0.25,0.25,0.25,0.25);\n  const heartG=new THREE.Group(); heartG.position.set(0,1.9,0.62); med.add(heartG);\n  const heart=mesh(new THREE.ExtrudeGeometry(hShape,{depth:0.16,bevelEnabled:true,bevelThickness:0.04,bevelSize:0.04,bevelSegments:2,steps:1}),heartMat,'med_heart');\n  heart.rotation.z=Math.PI; heart.position.set(0.14,0.28,-0.08); heart.scale.setScalar(0.56); heartG.add(heart);\n  const heartRings=[];\n  for(let i=0;i<5;i++){ const rc=new THREE.Color('#ff2d4a').lerp(new THREE.Color(p.body),i/5);\n    const rm=new THREE.MeshBasicMaterial({color:rc,transparent:true,opacity:0.25,side:THREE.DoubleSide}); rm.name='heart_ring_'+i;\n    const ring=mesh(new THREE.TorusGeometry(0.55+i*0.32,0.022,SEG(8),SEG(40)),rm,'heart_ring');\n    ring.position.set(0,1.9,0.55); med.add(ring); heartRings.push(ring); }\n  const waves=[];\n  const mkWave=(s,color,phase)=>{ const pts=[];\n    for(let i=0;i<=48;i++){ const x=i/48*6.5, env=Math.exp(-Math.pow((x-2.6)/1.7,2));\n      pts.push(V(s*(0.7+x),1.9+Math.sin(x*2.4+phase)*env,0.55)); }\n    const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:0.7}); mat.name='energy_wave';\n    const w=mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),SEG(48),0.035,SEG(8),false),mat,'energy_wave');\n    w.userData.ph=phase; w.userData.side=s; med.add(w); waves.push(w); };\n  for(const s of [1,-1]){ mkWave(s,p.accent,0); mkWave(s,p.body,1.5); mkWave(s,p.beak,3.0); }\n  sceneDrones=drones;\n  const tick=(t)=>{ ticks.forEach(fn=>fn(t));\n    spotPivots.forEach((pv,i)=>{ const e=new THREE.Euler(Math.sin(t*0.9+i)*0.12,0,Math.cos(t*0.7+i*1.3)*0.12);\n      pv.quaternion.copy(pv.userData.baseQ).multiply(new THREE.Quaternion().setFromEuler(e));\n      pv.position.y=pv.userData.baseY+Math.sin(t*1.1+i*1.7)*0.08; });\n    drones.forEach((c)=>{ const u=c.userData, a=t*u.sp+u.ph;\n      c.position.set(Math.cos(a)*u.r, u.h+Math.sin(t*0.9+u.ph)*0.18, Math.sin(a)*u.r);\n      c.lookAt(0,topY
