.5,flatShading:LOWPOLY}); capMat.name='cap';\n        const cap=sphere(wr*0.22,capMat,'cap',10,8); cap.position.set(wx,y,wallD/2+0.02); wall.add(cap);\n        speakerCols[c].cones.push({cone,cap,capMat,coneZ:wallD/2-0.04,capZ:wallD/2+0.02});\n      }\n      continue;\n    }\n    // screen cells sit in the same rectangular envelope\n    const isBig=(type==='vid');\n    const SW=(isBig?cellW*2:cellW)-0.06, SH=(isBig?cellH*2:cellH)-0.05;\n    const sx0=isBig?(x+cellW/2):x, sy0=isBig?(y+cellH/2):y;\n    const shell=box(SW+0.05,SH+0.05,wallD,frameMat,'screen_box'); shell.position.set(sx0,sy0,0); wall.add(shell);\n    const blk=box(SW,SH,0.04,screenBg,'screen_face'); blk.position.set(sx0,sy0,wallD/2+0.02); wall.add(blk);\n    if(type==='vid'||type==='vid1'){\n      const vt=getVideoTexture(type==='vid'?0:(1+videoSlotCount++));\n      if(vt){ const vm=new THREE.MeshBasicMaterial({map:vt}); vm.name='screen_video';\n        const pv=box(SW-0.06,SH-0.06,0.02,vm,'screen_video'); pv.position.set(sx0,sy0,wallD/2+0.05); wall.add(pv); }\n    } else if(type==='spon'){\n      const scv=document.createElement('canvas'); scv.width=512; scv.height=256;\n      const stx=new THREE.CanvasTexture(scv); stx.colorSpace=THREE.SRGBColorSpace;\n      const sm2=new THREE.MeshBasicMaterial({map:stx}); sm2.name='screen_sponsor';\n      const sp2=box(SW-0.06,SH-0.06,0.02,sm2,'screen_sponsor'); sp2.position.set(sx0,sy0,wallD/2+0.05); wall.add(sp2);\n      sponsorPanels.push({cv:scv,tx:stx,brand:SPONSORS[sponsorPanels.length%SPONSORS.length],ph:R()*9});\n    } else if(type==='spec'){\n      const NB2=12, bwid=(SW-0.12)/NB2;\n      for(let i=0;i<NB2;i++){\n        const col=new THREE.Color().setHSL(0.9-(i/NB2)*0.55,0.85,0.6);\n        const bm=new THREE.MeshBasicMaterial({color:col}); bm.name='spec_bar';\n        const bar=box(bwid*0.6,1,0.02,bm,'spec_bar');\n        bar.position.set(sx0-(SW-0.12)/2+bwid*(i+0.5),sy0,wallD/2+0.05);\n        bar.scale.y=0.06; wall.add(bar);\n        specBars.push({bar,baseY:sy0-SH/2+0.04,maxH:SH-0.1,idx:i});\n      }\n    } else if(type==='lyr'){\n      const tx=lyricTexture(LYRIC_LINES[Math.floor(R()*LYRIC_LINES.length)]);\n      const lm=new THREE.MeshBasicMaterial({map:tx}); lm.name='screen_lyrics';\n      const pl2=box(SW-0.06,SH-0.06,0.02,lm,'screen_lyrics'); pl2.position.set(sx0,sy0,wallD/2+0.05); wall.add(pl2);\n      lyricPanels.push({mat:lm,next:0});\n    }\n  }\n  const maxTop=wallTop;\n  // flamingo characters standing ON TOP of the wall (uniform height + depth)\n  const ticks=[];\n  const kinds=['sax','tamb','keys','solo','drums'].sort(function(){return R()-0.5;});\n  const nF=3+Math.floor(R()*2);\n  const slots=[];\n  for(let c=1;c<NCOL-1;c++) slots.push(-wallW/2+cellW*(c+0.5));\n  slots.sort(()=>R()-0.5);\n  for(let i=0;i<nF&&i<slots.length;i++){\n    const kind=kinds[i%kinds.length];\n    const pl=makePlayer(M,kind,{phase:R()*6.28,amp:1.0+R()*0.3});\n    const beakMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(R(),0.78,0.55),roughness:0.5,flatShading:LOWPOLY}); beakMat.name='beak_rnd';\n    const shMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(R(),0.85,0.5),roughness:0.35,metalness:0.25,flatShading:LOWPOLY}); shMat.name='shades_rnd';\n    pl.group.traverse(function(o){ if(o.isMesh){\n      if(o.name==='beak') o.material=beakMat;\n      if(o.name==='lens_rim'||o.name==='bridge') o.material=shMat; } });\n    pl.group.position.set(slots[i],0,0);\n    pl.group.rotation.y=(R()-0.5)*0.6; pl.group.scale.setScalar(0.8);\n    pl.group.updateMatrixWorld(true);\n    const bb=new THREE.Box3().setFromObject(pl.group);\n    pl.group.position.y=wallTop-bb.min.y;   // seat the lowest point exactly on the wall top\n    g.add(pl.group); ticks.push(pl.tick);\n  }\n  // crowd in front\n  const crowd=[]; const NC=42+Math.floor(R()*22);\n  const skinTones=['#c9976f','#8a5a3a','#e0b48c','#6e4428','#f0c9a0'];\n  const shirtC=[p.accent,p.body,p.brass,p.beak,'#cf4f3e','#4f7dcf','#e8e4da','#3d3a45'];\n  for(let i=0;i<NC;i++){\n    const per=new THREE.Group(); per.name='person_'+i;\n    per.position.set((R()-0.5)*(totalW+4),0,2.2+R()*6); per.rotation.y=Math.PI+(R()-0.5)*0.7;\n    const shirtMat=new THREE.MeshStandardMaterial({color:new THREE.Color(shirtC[i%shirtC.length]),roughness:0.85,flatShading:LOWPOLY}); shirtMat.name='shirt';\n    const skinMat=new THREE.MeshStandardMaterial({color:new THREE.Color(skinTones[i%skinTones.length]),roughness:0.8,flatShading:LOWPOLY}); skinMat.name='skin';\n    const pantMat=new THREE.MeshStandardMaterial({color:new THREE.Color('#2e2b33'),roughness:0.9,flatShading:LOWPOLY}); pantMat.name='pants';\n    const legs=box(0.16,0.42,0.1,pantMat,'legs'); legs.position.y=0.21; per.add(legs);\n    const torso=box(0.24,0.4,0.14,shirtMat,'torso'); torso.position.y=0.62; per.add(torso);\n    const headP=sphere(0.09,skinMat,'head',10,8); headP.position.y=0.95; per.add(headP);\n    const armUp=R()<0.45;\n    for(const s of [1,-1]){ const arm=box(0.055,0.34,0.055,skinMat,'p_arm');\n      arm.position.set(s*0.16,armUp?0.93:0.6,0); per.add(arm); }\n    per.userData={ph:R()*6.28, sp:0.8+R()*0.7, jump:R()<0.4};\n    g.add(per); crowd.push(per);\n  }\n  // camera drones orbiting the festival\n  const drones=[];\n  for(let i=0;i<4;i++){\n    const cam=new THREE.Group(); cam.name='camera_drone_'+i; g.add(cam);\n    const bodyC=box(0.22,0.16,0.3,M.plastic,'cam_body'); cam.add(bodyC);\n    const lensC=cyl(0.06,0.08,0.14,M.dark,'cam_lens',12); lensC.rotation.x=Math.PI/2; lensC.position.set(0,0,0.2); cam.add(lensC);\n    for(const rx of [-0.14,0.14]) for(const rz of [-0.16,0.16]){ const rotor=cyl(0.07,0.07,0.012,M.metal,'rotor',10); rotor.position.set(rx,0.1,rz); cam.add(rotor); }\n    cam.userData={r:totalW/2+2.5+i*0.9, h:1.8+i*0.9, sp:0.22+i*0.07, ph:i*1.6};\n    drones.push(cam);\n  }\n  sceneDrones=drones;\n  const lookY=maxTop*0.7;\n  const tick=(t)=>{ ticks.forEach(fn=>fn(t));\n    drones.forEach((c)=>{ const u=c.userData, a=t*u.sp+u.ph;\n      c.position.set(Math.cos(a)*u.r, u.h+Math.sin(t*0.9+u.ph)*0.2, Math.sin(a)*u.r);\n      c.lookAt(0,lookY,0); });\n    if(CAMVIEW>0){ const d=drones[(CAMVIEW-1)%drones.length]; const c=stage._camera, ct=stage._controls;\n      ct.enabled=false; d.updateWorldMatrix(true,false);\n      const pos=new THREE.Vector3(0,0.02,0.36).applyMatrix4(d.matrixWorld);\n      c.position.copy(pos); c.lookAt(0,lookY,0); }\n    const nst=AUDIO.stems.length;\n    speakerCols.forEach((sc,i)=>{\n      const st=nst?AUDIO.stems[i%nst]:null;\n      const lv=st?st.level:(audioPlaying?AUDIO.level:0.04+0.04*Math.sin(t*2+i));\n      const bs=st?st.bass:lv;\n      sc.cones.forEach(cn=>{ const push=bs*0.12;\n        cn.cone.position.z=cn.coneZ+push; cn.cap.position.z=cn.capZ+push;\n        const sq=1+bs*0.22; cn.cone.scale.set(sq,sq,1);\n        cn.capMat.emissiveIntensity=0.35+lv*3.0; });\n    });\n    sponsorPanels.forEach((sp,si)=>{\n      const cx=sp.cv.getContext('2d');\n      cx.fillStyle='#07060e'; cx.fillRect(0,0,512,256);\n      const gl=Math.max(0,Math.sin(t*1.7+sp.ph))>0.93||(audioPlaying&&AUDIO.high>0.5);\n      cx.font='bold 58px \"Courier New\", monospace'; cx.textAlign='center'; cx.textBaseline='middle';\n      const jx=gl?(Math.random()-0.5)*22:0, jy=gl?(Math.random()-0.5)*10:0;\n      cx.fillStyle='#0ff'; cx.fillText(sp.brand,256+jx-4,128+jy);\n      cx.fillStyle='#f0f'; cx.fillText(sp.brand,256+jx+4,128+jy);\n      cx.fillStyle=gl?'#fff':'#e8e6ff'; cx.fillText(sp.brand,256+jx,128+jy);\n      cx.font='22px \"Courier New\", monospace'; cx.fillStyle='#7f7ba8';\n      cx.fillText('OFFICIAL SPONSOR',256,196+(gl?(Math.random()-0.5)*8:0));\n      if(gl){ for(let k=0;k<5;k++){ const yy=Math.random()*256;\n        cx.drawImage(sp.cv,0,yy,512,8,(Math.random()-0.5)*40,yy,512,8); } }\n      sp.tx.needsUpdate=true;\n    });\n    specBars.forEach((sb)=>{\n      const v=audioPlaying&&AUDIO.spec?Math.max(0.05,AUDIO.spec[sb.idx*2]*1.35):0.07+0.06*Math.max(0,Math.sin(t*2.2+sb.idx*0.6));\n      const target=Math.min(1,v)*sb.maxH;\n      sb.bar.scale.y+=(target-sb.bar.scale.y)*0.45;\n      sb.bar.position.y=sb.baseY+sb.bar.scale.y/2; });\n    crowd.forEach((per)=>{ const u=per.userData;\n      const en=audioPlaying?(0.35+AUDIO.level*1.6):0.5;\n      per.position.y=Math.abs(Math.sin(t*(u.jump?3.1:2.2)*u.sp+u.ph))*(u.jump?0.16:0.05)*en;\n      per.rotation.z=Math.sin(t*2.6*u.sp+u.ph)*0.07*en; });\n    // sky meditator: levitate + heartbeat\n    med.position.y=medBaseY+Math.sin(t*0.45)*0.15; med.rotation.y=Math.sin(t*0.2)*0.05;\n    const beat=audioPlaying?(1+AUDIO.bass*1.2+AUDIO.level*0.25):(1+Math.max(0,Math.sin(t*3.4))*0.28);\n    heart.scale.setScalar(beat); heartMat.emissiveIntensity=1.6+beat;\n    heartRings.forEach((r,i)=>{ const ph=(t*0.5+i/3)%1; r.scale.setScalar(0.4+ph*5.2); r.material.opacity=0.45*(1-ph); });\n    if(playaDevils) playaDevils.forEach((dv,i)=>{ const u=dv.userData;\n      dv.rotation.y=t*u.sp*2.2+u.ph;\n      dv.children.forEach((rg,k)=>{ rg.rotation.z=t*u.sp*(0.6+k*0.12)+k; });\n      dv.position.x+=Math.sin(t*0.25+u.ph)*0.004*u.drift*10; });\n    if(playaFlames){ const bump=audioPlaying?(0.35+AUDIO.bass*2.2):1;\n      playaFlames.forEach(j=>{ const u=j.userData;\n        const f=0.45+Math.abs(Math.sin(t*1.6+u.ph))*1.15*bump;\n        j.scale.set(0.8+f*0.35,f,0.8+f*0.35);\n        j.position.y=u.base.y+1.7*f;\n        j.material.opacity=0.5+0.4*Math.min(1,f); }); }\n    if(playaMan){ const pulse=audioPlaying?(0.55+AUDIO.level*1.6):(0.75+0.25*Math.sin(t*2.2));\n      playaMan.neon.color.setHSL(0.52,0.9,Math.min(0.75,0.35+pulse*0.35)); }\n  };\n  return {obj:g, tick};\n}\n\n/* ---------- registry ---------- */\nlet dancing=true;\nconst MODELS=[\n  {key:'scene', label:'Cosmic Stage', name:'cosmic-stage', build:(M)=>buildSceneModel(M)},\n  {key:'festival', label:'Sound Wall', name:'sound-wall', build:(M)=>buildFestival(M)},\n  {key:'band', label:'The Band', name:'flamingo-band', build:(M)=>{\n     const g=new THREE.Group(); g.name='flamingo_band'; g.add(buildStage(M,1.5));\n     const members=[\n       {kind:'keys', x:-1.12, z:0.34, rot:0.45, phase:0.0},\n       {kind:'sax',  x:-0.28, z:-0.15,rot:0.08, phase:1.6},\n       {kind:'tamb', x:1.08,  z:0.34, rot:-0.55,phase:3.1},\n       {kind:'drums',x:0.5,   z:-1.05,rot:-0.22,phase:0.8}\n     ];\n     const ticks=[];\n     for(const m of members){ const p=makePlayer(M,m.kind,{phase:m.phase,speed:1,amp:0.95});\n       p.group.position.set(m.x,0.08,m.z); p.group.rotation.y=m.rot; g.add(p.group); ticks.push(p.tick); }\n     return { obj:g, tick:(t)=>ticks.forEach(fn=>fn(t)) };\n  }},\n  {key:'solo', label:'Flamingo', name:'flamingo-solo', build:(M)=>{ const p=makePlayer(M,'solo',{amp:1.1}); return {obj:p.group, tick:p.tick}; }},\n  {key:'sax', label:'Sax', name:'flamingo-sax', build:(M)=>{ const p=makePlayer(M,'sax',{}); return {obj:p.group, tick:p.tick}; }},\n  {key:'keys', label:'Keys', name:'flamingo-keys', build:(M)=>{ const p=makePlayer(M,'keys',{}); return {obj:p.group, tick:p.tick}; }},\n  {key:'drums', label:'Drums', name:'flamingo-drums', build:(M)=>{ const p=makePlayer(M,'drums',{}); return {obj:p.group, tick:p.tick}; }},\n  {key:'tamb', label:'Tambourine', name:'flamingo-tambourine', build:(M)=>{ const p=makePlayer(M,'tamb',{}); return {obj:p.group, tick:p.tick}; }},\n  {key:'piano', label:'Piano', name:'flamingo-piano', build:(M)=>{ const p=makePlayer(M,'piano',{}); return {obj:p.group, tick:p.tick}; }}\n];\n\nconst state={ model:hp.get('m')||'festival', palette:hp.get('p')||'cosmos' };\nif(hp.get('dance')==='0') dancing=false;\nlet currentTick=null;\n\nfunction render(){\n  VIDEO_SCREEN=null; resetVideoSlots();\n  const p=PALETTES[state.palette]; const M=buildMaterials(p);\n  const def=MODELS.find(m=>m.key===state.model)||MODELS[0];\n  const built=def.build(M);\n  const hasCams=(def.key==='scene'||def.key==='festival');\n  if(!hasCams){ stopRandom(); setGrid(false); if(CAMVIEW){ CAMVIEW=0; if(stage._controls) stage._controls.enabled=true; } }\n  updateCamBar(hasCams);\n  currentTick=built.tick||null;\n  stage.setAttribute('name', def.name+'-'+state.palette);\n  stage.style.setProperty('--stage-bg', p.bg);\n  stage.setObject(built.obj);\n  if(def.key==='scene'&&!keepCam){ setTimeout(()=>{ const c=stage._camera, ct=stage._controls;\n    ct.target.set(0,0.9,0); c.position.set(4.2,2.4,5.4); ct.update(); },50); }\n  if(def.key==='festival'&&!keepCam){ setTimeout(()=>{ const c=stage._camera, ct=stage._controls;\n    ct.target.set(0,2.2,0); c.position.set(1.5,2.6,15.5); ct.update(); },50); }\n  location.replace('#m='+state.model+'&p='+state.palette+(dancing?'':'&dance=0')+(LOWPOLY?'':'&lp=0')+'&v='+VENUE);\n}\n\n/* ---- video textures for wall screens: slot 0 = main 2x2, slots 1.. = extra screens ---- */\nconst VIDEO_SLOTS=[]; // {el,tex}\nlet USER_VIDEOS=[];   // object URLs from Videos… uploads\nconst DEFAULT_VIDEO='https://planetarycouncil.org/binface/marsita-the-ultra-vote-for-the-bin.mp4';\nfunction makeVideoEl(src){\n  const v=document.createElement('video');\n  v.crossOrigin='anonymous'; v.loop=true; v.muted=true; v.playsInline=true; v.autoplay=true;\n  v.src=src; v.play().catch(()=>{});\n  return v;\n}\nfunction getVideoTexture(slot){\n  if(VIDEO_SLOTS[slot]) return VIDEO_SLOTS[slot].tex;\n  const src=USER_VIDEOS.length?USER_VIDEOS[slot%USER_VIDEOS.length]:DEFAULT_VIDEO;\n  const el=makeVideoEl(src);\n  const tex=new THREE.VideoTexture(el); tex.colorSpace=THREE.SRGBColorSpace;\n  VIDEO_SLOTS[slot]={el,tex};\n  return tex;\n}\nfunction resetVideoSlots(){\n  VIDEO_SLOTS.forEach(s=>{ if(s){ try{s.el.pause();}catch(e){} s.tex.dispose(); } });\n  VIDEO_SLOTS.length=0;\n}\nconst videosBtn=document.getElementById('videosBtn'), videosInput=document.getElementById('videosInput');\nvideosBtn.onclick=()=>videosInput.click();\nvideosInput.onchange=()=>{ if(!videosInput.files.length) return;\n  USER_VIDEOS.forEach(u=>URL.revokeObjectURL(u));\n  USER_VIDEOS=[...videosInput.files].map(f=>URL.createObjectURL(f));\n  videosBtn.textContent=USER_VIDEOS.length+' video'+(USER_VIDEOS.length>1?'s':'');\n  resetVideoSlots(); keepCamNext=true; render(); };\nlet keepCamNext=false;\n\n/* ---------- menu ---------- */\nconst modelsEl=document.getElementById('models');\nMODELS.forEach(m=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=m.label; b.dataset.k=m.key;\n  b.onclick=()=>{ state.model=m.key; syncChips(); render(); }; modelsEl.appendChild(b); });\nconst palEl=document.getElementById('palettes');\nObject.entries(PALETTES).forEach(([k,p])=>{ const b=document.createElement('button'); b.className='sw'; b.dataset.p=k; b.title=p.label;\n  b.style.background=`conic-gradient(${p.body} 0 33%, ${p.brass} 0 66%, ${p.accent} 0)`;\n  b.onclick=()=>{ state.palette=k; syncChips(); render(); }; palEl.appendChild(b); });\nconst danceBtn=document.getElementById('danceToggle');\ndanceBtn.onclick=()=>{ dancing=!dancing; danceBtn.classList.toggle('off',!dancing); danceBtn.childNodes[1].nodeValue=dancing?'Dancing':'Paused';\n  location.replace('#m='+state.model+'&p='+state.palette+(dancing?'':'&dance=0')+(LOWPOLY?'':'&lp=0')); };\nconst venueBar=document.getElementById('venueBar');\nfunction syncVenue(){ venueBar.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.v===VENUE)); }\nvenueBar.addEventListener('click',(e)=>{ const v=e.target.dataset&&e.target.dataset.v; if(!v) return;\n  VENUE=v; syncVenue();\n  if(state.model!=='festival'){ state.model='festival'; syncChips(); }\n  keepCam=true; const c=stage._camera, ct=stage._controls;\n  const pos=c.position.clone(), tgt=ct?ct.target.clone():null;\n  render();\n  setTimeout(()=>{ if(ct&&tgt&&!GRID&&CAMVIEW===0){ c.position.copy(pos); ct.target.copy(tgt); ct.update(); } keepCam=false; },120); });\nconst rerollBtn=document.getElementById('rerollBtn');\nlet keepCam=false;\nrerollBtn.onclick=()=>{ keepCam=true;\n  LAYOUT_SEED=Math.floor(Math.random()*1e9);\n  const c=stage._camera, ct=stage._controls;\n  const pos=c.position.clone(), tgt=ct?ct.target.clone():null;\n  render();\n  setTimeout(()=>{ if(ct&&tgt&&!GRID&&CAMVIEW===0){ c.position.copy(pos); ct.target.copy(tgt); ct.update(); } keepCam=false; },120); };\nconst polyBtn=document.getElementById('polyToggle');\npolyBtn.onclick=()=>{ LOWPOLY=!LOWPOLY; polyBtn.classList.toggle('off',!LOWPOLY); render(); };\n/* ---- 2x2 drone grid ---- */\nlet GRID=false, gridCams=null, sceneDrones=null;\nfunction gridLoop(){ const r=stage._renderer; stage._controls.update();\n  const size=r.getSize(new THREE.Vector2()); const w=size.x/2, h=size.y/2;\n  r.setScissorTest(true);\n  for(let i=0;i<4;i++){ const cam=gridCams[i];\n    if(sceneDrones&&sceneDrones[i]){ const d=sceneDrones[i]; d.updateWorldMatrix(true,false);\n      cam.position.set(0,0.02,0.36).applyMatrix4(d.matrixWorld); cam.lookAt(0,1.1,0); }\n    cam.aspect=w/h; cam.updateProjectionMatrix();\n    const x=(i%2)*w, y=(i<2)?h:0;\n    r.setViewport(x,y,w,h); r.setScissor(x,y,w,h); r.render(stage._scene,cam); }\n  r.setScissorTest(false);\n}\nfunction setGrid(on){ if(on===GRID) return; GRID=on; const r=stage._renderer; if(!r) { GRID=false; return; }\n  if(on){ stopRandom(); CAMVIEW=0; stage._controls.enabled=false;\n    if(!gridCams) gridCams=[0,1,2,3].map(()=>new THREE.PerspectiveCamera(50,1,0.1,200));\n    r.setAnimationLoop(gridLoop);\n  } else { const size=r.getSize(new THREE.Vector2());\n    r.setScissorTest(false); r.setViewport(0,0,size.x,size.y); r.setScissor(0,0,size.x,size.y);\n    stage._controls.enabled=true; r.setAnimationLoop(stage._loop); }\n  syncCamBar(); }\n/* ---- camera bar ---- */\nconst camBar=document.getElementById('camBar'), camShow=document.getElementById('camShow');\nlet randTimer=null, randomOn=false, camBarHidden=false;\nfunction stopRandom(){ randomOn=false; if(randTimer){ clearTimeout(randTimer); randTimer=null; } }\nfunction scheduleRandom(){ randTimer=setTimeout(()=>{ let n; do{ n=1+Math.floor(Math.random()*4); }while(n===CAMVIEW);\n  setCam(n,true); scheduleRandom(); }, 3000+Math.random()*2000); }\nlet savedOrbit=null;\nfunction setCam(n,fromRandom){ if(!fromRandom) stopRandom(); if(GRID) setGrid(false);\n  const ct=stage._controls;\n  if(n&&CAMVIEW===0&&ct&&ct.enabled){ savedOrbit={pos:stage._camera.position.clone(),tgt:ct.target.clone()}; } // remember where the user was\n  CAMVIEW=n; syncCamBar();\n  if(!n&&ct){ ct.enabled=true;\n    if(savedOrbit){ stage._camera.position.copy(savedOrbit.pos); ct.target.copy(savedOrbit.tgt); }\n    else { ct.target.set(0,0.9,0); stage._camera.position.set(4.2,2.4,5.4); }\n    ct.update(); } }\nfunction syncCamBar(){ camBar.querySelectorAll('.chip').forEach(b=>{\n  const c=b.dataset.c; if(c==null||c==='h') return;\n  if(c==='r') b.classList.toggle('active',randomOn);\n  else if(c==='g') b.classList.toggle('active',GRID);\n  else b.classList.toggle('active',!GRID&&String(CAMVIEW)===c); }); }\nfunction updateCamBar(isScene){ camBar.style.display=(isScene&&!camBarHidden)?'':'none';\n  camShow.style.display=(isScene&&camBarHidden)?'inline-block':'none'; }\ncamBar.addEventListener('click',(e)=>{ const c=e.target.dataset&&e.target.dataset.c; if(c==null) return;\n  if(c==='h'){ camBarHidden=true; updateCamBar(state.model==='scene'); return; }\n  if(c==='g'){ setGrid(!GRID); return; }\n  if(c==='r'){ if(GRID) setGrid(false); if(randomOn){ stopRandom(); } else { stopRandom(); randomOn=true; setCam(1+Math.floor(Math.random()*4),true); scheduleRandom(); } syncCamBar(); return; }\n  setCam(+c); });\ncamShow.onclick=()=>{ camBarHidden=false; updateCamBar(state.model==='scene'); };\n/* ---- stems wiring ---- */\nconst stemsBtn=document.getElementById('stemsBtn'), stemsInput=document.getElementById('stemsInput'), playBtn=document.getElementById('playBtn');\nstemsBtn.onclick=()=>stemsInput.click();\nstemsInput.onchange=async()=>{ if(!stemsInput.files.length) return;\n  stemsBtn.textContent='Loading…';\n  try{ await loadStems([...stemsInput.files]);\n    stemsBtn.textContent=stemsInput.files.length+' stem'+(stemsInput.files.length>1?'s':'');\n    playBtn.style.display=''; playBtn.textContent='Pause';\n  }catch(err){ stemsBtn.textContent='Stems…'; alert('Could not decode that audio file.'); } };\nplayBtn.onclick=()=>{ if(audioPlaying){ stopStems(); playBtn.textContent='Play'; } else { playStems(); playBtn.textContent='Pause'; } };\nfunction syncChips(){\n  modelsEl.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active', b.dataset.k===state.model));\n  palEl.querySelectorAll('.sw').forEach(b=>b.classList.toggle('active', b.dataset.p===state.palette));\n  danceBtn.classList.toggle('off',!dancing); danceBtn.childNodes[1].nodeValue=dancing?'Dancing':'Paused';\n  polyBtn.classList.toggle('off',!LOWPOLY);\n}\nconst aboutBtn=document.getElementById('aboutBtn'), aboutOverlay=document.getElementById('aboutOverlay');\naboutBtn.onclick=()=>{ aboutOverlay.style.display=''; };\ndocument.getElementById('aboutClose').onclick=()=>{ aboutOverlay.style.display='none'; };\ndocument.getElementById('aiCopy').onclick=async()=>{ const ta=document.getElementById('aiPrompt'); ta.select();\n  try{ await navigator.clipboard.writeText(ta.value); document.getElementById('aiCopy').textContent='Copied!'; }catch(e){ document.execCommand('copy'); } };\nsyncChips();\nsyncVenue();\nsyncCamBar();\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
